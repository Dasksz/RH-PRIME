      // Helper para calcular horas úteis
      function calcularHorasUteisLocal(dataInicio, dataFim, cargaHoraria) {
        if (!dataInicio || !dataFim) return 0;
        let dInicio = new Date(dataInicio + "T00:00:00");
        let dFim = new Date(dataFim + "T00:00:00");

        if (isNaN(dInicio.getTime()) || isNaN(dFim.getTime()) || dInicio > dFim) return 0;

        const fatorCarga = (cargaHoraria && !isNaN(Number(cargaHoraria)) && Number(cargaHoraria) > 0) ? (Number(cargaHoraria) / 220) : 1;

        let totalHoras = 0;
        let current = new Date(dInicio);

        while (current <= dFim) {
          const diaSemana = current.getDay();
          if (diaSemana >= 1 && diaSemana <= 5) {
            totalHoras += 8 * fatorCarga;
          } else if (diaSemana === 6) {
            totalHoras += 4 * fatorCarga;
          }
          current.setDate(current.getDate() + 1);
        }
        return Math.round(totalHoras * 10) / 10;
      }

      function App() {
        const [session, setSession] = useState(null);
        const [isAuthChecking, setIsAuthChecking] = useState(true);
        const [absenteismo, setAbsenteismo] = useState([]);
        const [colaboradores, setColaboradores] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [mesFiltro, setMesFiltro] = useState("todos");
        const [funcFiltro, setFuncFiltro] = useState("todos");
        const [searchTerm, setSearchTerm] = useState("");
        const [mesesDisponiveis, setMesesDisponiveis] = useState([]);

        // Cadastrar Falta Modal State
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [selectedColabCpf, setSelectedColabCpf] = useState("");
        const [modalColabSearch, setModalColabSearch] = useState("");
        const [faltaForm, setFaltaForm] = useState({
          data_inicio: new Date().toISOString().split("T")[0],
          data_fim: new Date().toISOString().split("T")[0],
          motivo_tipo: "Com Atestado Médico",
          observacao: "",
          horas_perdidas_custom: "",
        });
        const [isSubmitting, setIsSaving] = useState(false);

        useEffect(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const mesUrl = urlParams.get("mes");
          if (mesUrl) setMesFiltro(mesUrl);
        }, []);

                // Lock background scroll when modal is open
        useEffect(() => {
          if (isModalOpen) {
            document.body.style.overflow = "hidden";
          } else {
            document.body.style.overflow = "";
          }
          return () => {
            document.body.style.overflow = "";
          };
        }, [isModalOpen]);

        useEffect(() => {
          checkSession();
        }, []);

        const checkSession = async () => {
          setIsAuthChecking(true);
          const { data: { session } } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "login.html";
          } else {
            setSession(session);
            fetchData();
          }
        };

        const fetchData = async () => {
          try {
            setIsLoading(true);

            const { data: absData, error: absErr } = await supabase
              .from("rh_absenteismo")
              .select("*")
              .order("data_inicio", { ascending: false });

            if (absErr) throw absErr;

            const { data: colabData, error: colabErr } = await supabase
              .from("funcionarios_epi")
              .select("id, nome, cpf, carga_horaria")
              .order("nome", { ascending: true });

            if (colabErr) throw colabErr;

            setAbsenteismo(absData || []);
            setColaboradores(colabData || []);

            const meses = new Set();
            (absData || []).forEach((item) => {
              if (item.mes_ref) meses.add(item.mes_ref);
            });

            const ordenarMesesAno = (a, b) => {
              const [mesA, anoA] = a.split("/");
              const [mesB, anoB] = b.split("/");
              if (anoA !== anoB) return parseInt(anoB) - parseInt(anoA);
              return parseInt(mesB) - parseInt(mesA);
            };

            setMesesDisponiveis(Array.from(meses).sort(ordenarMesesAno));
          } catch (error) {
            console.error("Erro ao buscar dados:", error.message);
          } finally {
            setIsLoading(false);
            setIsAuthChecking(false);
          }
        };

        const formatarData = (dataStr) => {
          if (!dataStr) return "-";
          const partes = dataStr.split("-");
          if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
          return dataStr;
        };

        // Dados Filtrados
        const dadosFiltrados = useMemo(() => {
          return absenteismo.filter((item) => {
            if (mesFiltro !== "todos" && item.mes_ref !== mesFiltro) return false;
            if (funcFiltro !== "todos") {
              const cpfClean = (item.cpf || "").replace(/\D/g, "");
              const funcCpfClean = funcFiltro.replace(/\D/g, "");
              if (cpfClean && funcCpfClean) {
                if (cpfClean !== funcCpfClean) return false;
              } else if (item.funcionario_nome !== funcFiltro) {
                return false;
              }
            }
            if (searchTerm.trim() !== "") {
              const term = searchTerm.toLowerCase().trim();
              const termDigits = term.replace(/\D/g, "");
              const nomeMatch = item.funcionario_nome && item.funcionario_nome.toLowerCase().includes(term);
              const cpfMatch = termDigits !== "" && item.cpf && item.cpf.replace(/\D/g, "").includes(termDigits);
              const motivoMatch = item.motivo && item.motivo.toLowerCase().includes(term);
              if (!nomeMatch && !cpfMatch && !motivoMatch) return false;
            }
            return true;
          });
        }, [absenteismo, mesFiltro, funcFiltro, searchTerm]);

        
        // Colaboradores filtrados na modal de cadastro
        const colaboradoresFiltradosModal = useMemo(() => {
          if (!modalColabSearch.trim()) return colaboradores;
          const term = modalColabSearch.toLowerCase().trim();
          return colaboradores.filter((c) => {
            const nomeMatch = c.nome && c.nome.toLowerCase().includes(term);
            const cpfMatch = c.cpf && c.cpf.replace(/\D/g, "").includes(term.replace(/\D/g, ""));
            return nomeMatch || (term.replace(/\D/g, "") !== "" && cpfMatch);
          });
        }, [colaboradores, modalColabSearch]);

        // Auto-calculo de horas na modal
        
        // Atualiza a seleção quando a busca na modal altera
        useEffect(() => {
          if (isModalOpen && colaboradoresFiltradosModal.length > 0) {
            const exists = colaboradoresFiltradosModal.some(c => (c.cpf || c.nome) === selectedColabCpf);
            if (!exists) {
              setSelectedColabCpf(colaboradoresFiltradosModal[0].cpf || colaboradoresFiltradosModal[0].nome || "");

          }
        }, [modalColabSearch, isModalOpen, colaboradoresFiltradosModal]);

        const colabSelecionadoObj = useMemo(() => {
          return colaboradores.find((c) => (c.cpf || "").replace(/\D/g, "") === selectedColabCpf.replace(/\D/g, ""));
        }, [colaboradores, selectedColabCpf]);

        const horasCalculadasAuto = useMemo(() => {
          const carga = colabSelecionadoObj ? colabSelecionadoObj.carga_horaria || 220 : 220;
          return calcularHorasUteisLocal(faltaForm.data_inicio, faltaForm.data_fim, carga);
        }, [faltaForm.data_inicio, faltaForm.data_fim, colabSelecionadoObj]);

        const handleOpenEdit = (item) => {
          setEditItem({
            id: item.id,
            funcionario_nome: item.funcionario_nome,
            data_inicio: item.data_inicio || "",
            data_fim: item.data_fim || "",
            horas_perdidas: item.horas_perdidas || "",
            motivo: item.motivo || "",
            carga_horaria: item.carga_horaria || 220,
          });
          setIsEditModalOpen(true);
        };

        const handleSalvarEdit = async (e) => {
          e.preventDefault();
          if (!editItem.id) return;

          setIsSaving(true);
          try {
            const parts = editItem.data_inicio.split("-");
            const mesRefCalculado = `${parts[1]}/${parts[0]}`;

            const payload = {
              data_inicio: editItem.data_inicio,
              data_fim: editItem.data_fim,
              mes_ref: mesRefCalculado,
              horas_perdidas: Number(editItem.horas_perdidas) || 0,

              carga_horaria: Number(editItem.carga_horaria) || 220,
            };

            const { error } = await supabase
              .from("rh_absenteismo")
              .update(payload)
              .eq("id", editItem.id);

            if (error) throw error;

            alert("Registro de absenteísmo atualizado com sucesso!");

            fetchData();
          } catch (err) {
            console.error("Erro ao atualizar absenteísmo:", err);
            alert("Erro ao atualizar registro: " + err.message);
          } finally {
            setIsSaving(false);

        const handleExcluirAbsenteismo = async (id) => {
          if (!window.confirm("Deseja realmente excluir este registro de absenteísmo?")) return;
          try {
            const { error } = await supabase.from("rh_absenteismo").delete().eq("id", id);
            if (error) throw error;
            alert("Registro excluído com sucesso!");
            fetchData();
          } catch (err) {
            console.error("Erro ao excluir registro:", err);
            alert("Erro ao excluir registro: " + err.message);
          }
        };

        const handleCadastrarFaltaSubmit = async (e) => {
          e.preventDefault();
          if (!selectedColabCpf || !colabSelecionadoObj) {
            alert("Selecione o colaborador.");
            return;
          }

          setIsSaving(true);
          try {
            const parts = faltaForm.data_inicio.split("-");
            const mesRefCalculado = `${parts[1]}/${parts[0]}`;

            const horasFinais = faltaForm.horas_perdidas_custom !== "" ? Number(faltaForm.horas_perdidas_custom) : horasCalculadasAuto;
            const motivoCompleto = faltaForm.observacao ? `${faltaForm.motivo_tipo} - ${faltaForm.observacao}` : faltaForm.motivo_tipo;

            const payload = {
              funcionario_nome: colabSelecionadoObj.nome,
              cpf: colabSelecionadoObj.cpf ? colabSelecionadoObj.cpf.replace(/\D/g, "") : "",
              data_inicio: faltaForm.data_inicio,
              data_fim: faltaForm.data_fim,

            const { error } = await supabase.from("rh_absenteismo").insert([payload]);

              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${item.mes_ref || "-"}</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${item.carga_horaria || 220}h</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center; color: #ef4444; font-weight: bold;">${item.horas_perdidas ? item.horas_perdidas + "h" : "-"}</td>
              <td style="padding: 12px 16px; font-size: 10px; color: #475569;">${item.motivo || "Não informado"}</td>
            </tr>
          `
            )
            .join("");

          if (dadosFiltrados.length === 0) {
            tableRows = `<tr><td colspan="7" style="padding: 20px; text-align: center; color: #64748b;">Nenhum registro encontrado.</td></tr>`;
          }

          const dataEmissao = new Date().toLocaleDateString("pt-BR");
          const periodo = mesFiltro === "todos" ? "Todos os Períodos" : mesFiltro;

          container.innerHTML = `
            <div id="pdf-inner-content-absenteismo" style="width: 1080px; background-color: white; color: black; font-family: sans-serif; padding: 20px;">
              <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #002060; padding-bottom: 10px;">
                <h2 style="margin: 0; color: #002060; font-size: 18px;">PRIME RH - Relatório de Absenteísmo</h2>
                <p style="margin: 5px 0 0 0; color: #64748b; font-size: 12px;">Período: ${periodo} | Emitido em: ${dataEmissao}</p>
              </div>
              <div style="margin-bottom: 20px;">
                <p style="font-size: 12px; color: #334155; font-weight: bold;">Total de Horas Perdidas: <span style="color: #ef4444;">${totais.horas_perdidas}h</span></p>
              </div>
              <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead style="background-color: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                  <tr>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase;">Funcionário</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Data Início</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Data Fim</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Mês Ref</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Carga Horária</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Horas Perdidas</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase;">Motivo</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          `;

          document.body.appendChild(container);

          const opt = {
            margin: 10,
            filename: `Relatorio_Absenteismo_${periodo.replace("/", "_")}.pdf`,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
            pagebreak: { mode: ["css", "legacy"], avoid: "tr" },
          };

          const element = document.getElementById("pdf-inner-content-absenteismo");
          html2pdf()
            .set(opt)
            .from(element)
            .toPdf()
            .get("pdf")
            .then(function (pdf) {
              window.open(pdf.output("bloburl"), "_blank");
            })
            .save()
            .then(() => {
              document.body.removeChild(container);
            });
        };

        const totais = useMemo(() => {
          return dadosFiltrados.reduce(
            (acc, curr) => {
              acc.horas_perdidas += Number(curr.horas_perdidas) || 0;
              return acc;
            },
            { horas_perdidas: 0 }
          );
        }, [dadosFiltrados]);

        if (isAuthChecking || isLoading) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-gray-50">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col bg-slate-50">
            {/* Header */}
            <header className="bg-[#002060] text-white shadow-md relative z-10">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex justify-between items-center h-16">
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => (window.location.href = "indicadores.html")}
                      className="p-2 rounded-md hover:bg-white/10 transition-colors mr-2"
                      title="Voltar"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                      </svg>
                    </button>
                    <div className="h-10 w-10 bg-white rounded flex items-center justify-center overflow-hidden">
                      <img src="LOGO_RH.jpeg" alt="Logo" className="h-full w-full object-cover" />
                    </div>
                    <h1 className="text-xl font-bold tracking-tight">
                      PRIME RH <span className="text-blue-300 font-normal">| Detalhes de Absenteísmo</span>
                    </h1>
                  </div>

                  <nav className="hidden md:flex items-center gap-6 text-sm font-medium">
                    <a href="index.html" className="text-slate-300 hover:text-white">EPI/Fardamento</a>
                    <a href="colaboradores.html" className="text-slate-300 hover:text-white">Colaboradores</a>
                    <a href="ferias.html" className="text-slate-300 hover:text-white">Férias</a>
                    <a href="indicadores.html" className="text-slate-300 hover:text-white">Indicadores</a>
                  </nav>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
              {/* Controles Principais */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div className="flex items-center gap-3">
                  <div className="bg-blue-100 p-3 rounded-xl text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">Registros de Faltas & Afastamentos</h2>
                    <p className="text-sm text-slate-500">
                      Total acumulado no filtro: <span className="font-bold text-red-500">{totais.horas_perdidas}h perdidas</span>.
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                  <button
                    onClick={() => {
                      setModalColabSearch("");
                      if (colaboradores.length > 0) setSelectedColabCpf(colaboradores[0].cpf || colaboradores[0].nome || "");
                      setIsModalOpen(true);
                    }}
                    className="flex items-center gap-2 bg-[#002060] hover:bg-[#001848] text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm"
                  >
                    <Plus size={18} /> Cadastrar Falta
                  </button>

                  <button
                    onClick={gerarPDF}
                    className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm"
                    title="Emitir PDF"
                  >
                    Emitir PDF
                  </button>
                </div>
              </div>

              {/* Filtros em Linha */}
              <div className="bg-white p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div className="relative w-full md:w-80">
                  <Search size={18} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Pesquisar por nome, CPF ou motivo..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 text-slate-900 text-xs font-medium rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-[#002060]"
                  />
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <label className="text-xs font-bold text-slate-600 uppercase whitespace-nowrap">Mês Ref:</label>
                    <select
                      className="bg-slate-50 border border-slate-300 text-slate-900 text-xs font-bold rounded-xl p-2.5 outline-none w-full sm:w-44 focus:ring-2 focus:ring-[#002060]"
                      value={mesFiltro}
                      onChange={(e) => setMesFiltro(e.target.value)}
                    >
                      <option value="todos">Todos os Períodos</option>
                      {mesesDisponiveis.map((mes, idx) => (
                        <option key={idx} value={mes}>{mes}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <label className="text-xs font-bold text-slate-600 uppercase whitespace-nowrap">Colaborador:</label>
                    <select
                      className="bg-slate-50 border border-slate-300 text-slate-900 text-xs font-bold rounded-xl p-2.5 outline-none w-full sm:w-56 focus:ring-2 focus:ring-[#002060]"
                      value={funcFiltro}
                      onChange={(e) => setFuncFiltro(e.target.value)}
                    >
                      <option value="todos">Todos os Colaboradores</option>
                      {colaboradores.map((c) => (
                        <option key={c.id} value={c.cpf || c.nome}>{c.nome}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>

              {/* Tabela de Absenteísmo */}
              <div className="bg-white shadow-sm border border-slate-200 rounded-xl overflow-hidden">
                <div className="table-container">
                  <table className="min-w-full divide-y divide-slate-200 text-xs">
                    <thead className="bg-slate-50 sticky top-0 z-10 shadow-xs">
                      <tr>
                        <th className="px-6 py-4 text-left font-bold text-slate-500 uppercase">Funcionário</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Data Início</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Data Fim</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Mês Ref</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Carga Horária</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Horas Perdidas</th>
                        <th className="px-6 py-4 text-left font-bold text-slate-500 uppercase">Motivo / Observação</th>
                        <th className="px-6 py-4 text-center font-bold text-slate-500 uppercase">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="bg-white divide-y divide-slate-200 font-medium">
                      {dadosFiltrados.length > 0 ? (
                        dadosFiltrados.map((item, index) => (
                          <tr key={index} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-4 text-sm font-bold text-slate-900">{item.funcionario_nome}</td>
                            <td className="px-6 py-4 text-center text-slate-600">{formatarData(item.data_inicio)}</td>
                            <td className="px-6 py-4 text-center text-slate-600">{formatarData(item.data_fim)}</td>
                            <td className="px-6 py-4 text-center font-bold text-slate-500">{item.mes_ref || "-"}</td>
                            <td className="px-6 py-4 text-center text-slate-700">{item.carga_horaria || 220}h/mês</td>
                            <td className="px-6 py-4 text-center text-sm font-black text-red-500">
                              {item.horas_perdidas ? `${item.horas_perdidas}h` : "-"}
                            </td>
                            <td className="px-6 py-4 text-slate-700">
                              <span className="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full font-semibold bg-slate-100 text-slate-800">
                                {item.motivo || "Não informado"}
                              </span>
                            </td>
                            <td className="px-6 py-4 text-center whitespace-nowrap">
                              <div className="flex items-center justify-center gap-1.5">
                                <button
                                  onClick={() => handleOpenEdit(item)}
                                  className="p-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors border border-blue-200"
                                  title="Editar Registro"
                                >
                                  <Pencil size={14} />
                                </button>
                                <button
                                  onClick={() => handleExcluirAbsenteismo(item.id)}
                                  className="p-1.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200"
                                  title="Excluir Registro"
                                >
                                  <Trash2 size={14} />
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))
                      ) : (
                        <tr>
                          <td colSpan="8" className="px-6 py-10 text-center text-sm text-slate-500">
                            Nenhum registro de absenteísmo encontrado para estes filtros.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>

            
            {/* MODAL EDITAR ABSENTEÍSMO */}
            {isEditModalOpen && (
              <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-fadeIn my-auto">
                  <div className="bg-[#002060] p-4 text-white flex justify-between items-center shrink-0">
                    <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                      <Pencil size={20} /> Editar Falta / Afastamento
                    </h3>
                    <button onClick={() => setIsEditModalOpen(false)} className="text-white/80 hover:text-white">
                      <XCircle size={22} />
                    </button>
                  </div>

                  <form onSubmit={handleSalvarEdit} className="p-4 sm:p-6 space-y-4 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Colaborador</label>
                      <input
                        type="text"
                        disabled
                        value={editItem.funcionario_nome}
                        className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl font-bold text-slate-800 text-sm"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data Início *</label>
                        <input
                          type="date"
                          required
                          value={editItem.data_inicio}
                          onChange={(e) => setEditItem({ ...editItem, data_inicio: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data Fim *</label>
                        <input
                          type="date"
                          required
                          value={editItem.data_fim}
                          onChange={(e) => setEditItem({ ...editItem, data_fim: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Horas Perdidas *</label>
                        <input
                          type="number"
                          step="0.1"
                          required
                          value={editItem.horas_perdidas}
                          onChange={(e) => setEditItem({ ...editItem, horas_perdidas: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm font-bold text-red-600"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Carga Horária Mensal</label>
                        <input
                          type="number"
                          value={editItem.carga_horaria}
                          onChange={(e) => setEditItem({ ...editItem, carga_horaria: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Motivo / Observação *</label>
                      <input
                        type="text"
                        required
                        value={editItem.motivo}
                        onChange={(e) => setEditItem({ ...editItem, motivo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      />
                    </div>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold text-xs"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSaving}
                        className="px-6 py-2.5 text-white bg-[#002060] hover:bg-blue-900 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm"
                      >
                        {isSaving ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Salvar Alterações
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL CADASTRAR FALTA */}
            {isModalOpen && (
              <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-fadeIn my-auto">
                  <div className="bg-[#002060] p-4 text-white flex justify-between items-center shrink-0">
                    <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                      <Plus size={20} /> Cadastrar Falta / Afastamento
                    </h3>
                    <button onClick={() => setIsModalOpen(false)} className="text-white/80 hover:text-white">
                      <XCircle size={22} />
                    </button>
                  </div>

                  <form onSubmit={handleCadastrarFaltaSubmit} className="p-4 sm:p-6 space-y-4 text-xs overflow-y-auto flex-1">
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Selecionar Colaborador *</label>
                      <div className="relative mb-2">
                        <Search size={16} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                        <input
                          type="text"
                          placeholder="Pesquisar colaborador por nome ou CPF..."
                          value={modalColabSearch}
                          onChange={(e) => setModalColabSearch(e.target.value)}
                          className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#002060] outline-none"
                        />
                      </div>
                      <select
                        required
                        value={selectedColabCpf}
                        onChange={(e) => setSelectedColabCpf(e.target.value)}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      >
                        {colaboradoresFiltradosModal.length === 0 ? (
                          <option value="" disabled>Nenhum colaborador encontrado</option>
                        ) : (
                          colaboradoresFiltradosModal.map((c) => (
                            <option key={c.id} value={c.cpf || c.nome}>
                              {c.nome} - {c.carga_horaria || 220}h/mês
                            </option>
                          ))
                        )}
                      </select>
                      {colabSelecionadoObj && (
                        <p className="text-[10px] text-blue-700 font-bold mt-1">
                          Carga horária padrão do colaborador: {colabSelecionadoObj.carga_horaria || 220}h/mês
                        </p>
                      )}
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data Início *</label>
                        <input
                          type="date"
                          required
                          value={faltaForm.data_inicio}
                          onChange={(e) => setFaltaForm({ ...faltaForm, data_inicio: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data Fim *</label>
                        <input
                          type="date"
                          required
                          value={faltaForm.data_fim}
                          onChange={(e) => setFaltaForm({ ...faltaForm, data_fim: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Tipo de Falta / Motivo *</label>
                      <select
                        value={faltaForm.motivo_tipo}
                        onChange={(e) => setFaltaForm({ ...faltaForm, motivo_tipo: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      >
                        <option value="Com Atestado Médico">Com Atestado Médico</option>
                        <option value="Falta Não Justificada (Sem Atestado)">Falta Não Justificada (Sem Atestado)</option>
                        <option value="Falta Justificada">Falta Justificada</option>
                        <option value="Afastamento Inss / Licença">Afastamento INSS / Licença</option>
                        <option value="Suspensão">Suspensão</option>
                      </select>
                    </div>

                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-slate-700">Cálculo Automático de Horas Úteis:</span>
                        <span className="text-base font-black text-red-600">{horasCalculadasAuto} horas</span>
                      </div>
                      <p className="text-[10px] text-slate-500 mt-1">
                        Considera 8h/dia (seg-sex) e 4h (sáb) proporcional à carga horária do colaborador.
                      </p>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Alterar Horas Perdidas Manualmente (Opcional)</label>
                      <input
                        type="number"
                        step="0.5"
                        placeholder={`Deixe em branco para usar automático (${horasCalculadasAuto}h)`}
                        value={faltaForm.horas_perdidas_custom}
                        onChange={(e) => setFaltaForm({ ...faltaForm, horas_perdidas_custom: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Observações Adicionais</label>
                      <input
                        type="text"
                        placeholder="Ex: CID X, Atestado de 2 dias do Hospital Y"
                        value={faltaForm.observacao}
                        onChange={(e) => setFaltaForm({ ...faltaForm, observacao: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      />
                    </div>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 text-white bg-[#002060] hover:bg-[#001848] rounded-xl font-bold flex items-center gap-2 shadow-sm"
                      >
                        {isSubmitting ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Cadastrar Falta
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
