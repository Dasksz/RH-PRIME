    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const SUPABASE_URL = "https://gcksbfstheavpfgcdndb.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_UrTJ8_SyM3n800C4LZQWpw_5Ah8Ko98";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      // Ícones SVG
      const Icon = ({ size = 20, className = "", children }) => (
        <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
      const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></Icon>;
      const CheckCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></Icon>;
      const XCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></Icon>;

      const Trash2 = (p) => (

          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />

      );

      // Helper para calcular horas úteis
      function calcularHorasUteisLocal(dataInicio, dataFim, cargaHoraria) {
        if (!dataInicio || !dataFim) return 0;
        let dInicio = new Date(dataInicio + "T00:00:00");
        let dFim = new Date(dataFim + "T00:00:00");

        if (isNaN(dInicio.getTime()) || isNaN(dFim.getTime()) || dInicio > dFim) return 0;

        const fatorCarga = (cargaHoraria && !isNaN(Number(cargaHoraria)) && Number(cargaHoraria) > 0) ? (Number(cargaHoraria) / 220) : 1;

        let totalHoras = 0;
        let current = new Date(dInicio);

        while (current <= dFim) {
          const diaSemana = current.getDay();
          if (diaSemana >= 1 && diaSemana <= 5) {
            totalHoras += 8 * fatorCarga;
          } else if (diaSemana === 6) {
            totalHoras += 4 * fatorCarga;
          }
          current.setDate(current.getDate() + 1);
        }
        return Math.round(totalHoras * 10) / 10;
      }

      function App() {
        const [session, setSession] = useState(null);
        const [isAuthChecking, setIsAuthChecking] = useState(true);
        const [absenteismo, setAbsenteismo] = useState([]);
        const [colaboradores, setColaboradores] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [mesFiltro, setMesFiltro] = useState("todos");
        const [funcFiltro, setFuncFiltro] = useState("todos");
        const [searchTerm, setSearchTerm] = useState("");
        const [mesesDisponiveis, setMesesDisponiveis] = useState([]);

        // Cadastrar Falta Modal State
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [selectedColabCpf, setSelectedColabCpf] = useState("");
        const [modalColabSearch, setModalColabSearch] = useState("");
        const [faltaForm, setFaltaForm] = useState({
          data_inicio: RH.today(),
          data_fim: RH.today(),
          motivo_tipo: "Com Atestado Médico",
          observacao: "",
          horas_perdidas_custom: "",
        });
        const [isSubmitting, setIsSaving] = useState(false);
        const [faltaAttachment, setFaltaAttachment] = useState(null);
        const [editAttachment, setEditAttachment] = useState(null);
        const [removeEditAttachment, setRemoveEditAttachment] = useState(false);
        const [faltaDocument, setFaltaDocument] = useState({tipo:'atestado',data:'',dias:''});
        const [driveStates, setDriveStates] = useState({});
        const [driveReady, setDriveReady] = useState(null);

        useEffect(() => {
          let cancelled=false;
          const ids=absenteismo.filter(a=>a.atestado_path).map(a=>a.id);
          if(!ids.length){setDriveStates({});return;}
          const refresh=async()=>{
            const {data,error}=await supabase.rpc('rh_absence_drive_status',{p_ids:ids});
            if(cancelled||error)return;
            setDriveReady(!!data?.worker_ready);
            setDriveStates(Object.fromEntries((data?.records||[]).map(a=>[a.id,a])));
          };
          refresh();const timer=setInterval(refresh,30000);
          return ()=>{cancelled=true;clearInterval(timer);};
        },[absenteismo]);
        const retryDrive=async(id)=>{
          const {error}=await supabase.rpc('rh_retry_absence_drive',{p_id:id});
          if(error){alert(error.message);return;}fetchData();
        };
        const documentPreview=(employee,start,end,document,mime)=>{
          try{return RHAbsenceFiles.documentInfo({nome:employee,inicio:start,fim:end,...document,mime:mime||'application/pdf'}).atestado_nome;}
          catch{return 'Confira a data e os dias para gerar o nome.';}
        };

        const chooseAttachment = async (event, setter) => {
          const input=event.target, file=input.files?.[0];
          if(!file){setter(null);return;}
          try{await RHAbsenceFiles.validate(file);setter(file);}
          catch(err){input.value='';setter(null);alert(err.message);}
        };
        const openAttachment = (item) => RHAbsenceFiles.open(supabase,item).catch(err=>alert(err.message));
        const cleanupAttachment = async (path) => {
          try{await RHAbsenceFiles.remove(supabase,path);}
          catch(err){console.error(err.message);}
        };

        // Editar Falta Modal State
        const [isEditModalOpen, setIsEditModalOpen] = useState(false);
        const [editItem, setEditItem] = useState({
          id: null,
          funcionario_nome: "",
          data_inicio: "",
          data_fim: "",
          horas_perdidas: "",
          motivo: "",
          carga_horaria: 220,
        });

        useEffect(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const mesUrl = urlParams.get("mes");
          if (mesUrl) setMesFiltro(mesUrl);
        }, []);

        // Lock background scroll when modal is open
        useEffect(() => {
          if (isModalOpen || isEditModalOpen) {
            document.body.style.overflow = "hidden";
          } else {
            document.body.style.overflow = "";
          }
          return () => {
            document.body.style.overflow = "";
          };
        }, [isModalOpen, isEditModalOpen]);

        useEffect(() => {
          checkSession();
        }, []);

        const checkSession = async () => {
          try {
            setIsAuthChecking(true);
            await RH.profile(supabase);
            const { data: { session } } = await supabase.auth.getSession();
            setSession(session);
            await fetchData();
          } catch (error) {
            window.location.href = "login.html";
          }
        };

        useEffect(() => {
          if (!isAuthChecking) return RH.watch(supabase, ["rh_absenteismo", "funcionarios_epi"], fetchData);
        }, [isAuthChecking]);

        const fetchData = async () => {
          try {
            setIsLoading(true);

            const { data: absData, error: absErr } = await supabase
              .from("rh_absenteismo")
              .select("*")
              .order("data_inicio", { ascending: false });

            if (absErr) throw absErr;

            const { data: colabData, error: colabErr } = await supabase
              .from("funcionarios_epi")
              .select("id, nome, cpf, carga_horaria")
              .order("nome", { ascending: true });

            if (colabErr) throw colabErr;

            setAbsenteismo(absData || []);
            setColaboradores(colabData || []);

            const meses = new Set();
            RH.absByMonth(absData || []).forEach((item) => {
              if (item.mes_ref) meses.add(item.mes_ref);
            });

            const ordenarMesesAno = (a, b) => {
              const [mesA, anoA] = a.split("/");
              const [mesB, anoB] = b.split("/");
              if (anoA !== anoB) return parseInt(anoB) - parseInt(anoA);
              return parseInt(mesB) - parseInt(mesA);
            };

            setMesesDisponiveis(Array.from(meses).sort(ordenarMesesAno));
          } catch (error) {
            console.error("Erro ao buscar dados:", error.message);
          } finally {
            setIsLoading(false);
            setIsAuthChecking(false);
          }
        };

        const formatarData = (dataStr) => {
          if (!dataStr) return "-";
          const partes = dataStr.split("-");
          if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
          return dataStr;
        };

        // Dados Filtrados
        const dadosFiltrados = useMemo(() => {
          return (mesFiltro === "todos" ? absenteismo : RH.absByMonth(absenteismo)).filter((item) => {
            if (mesFiltro !== "todos" && item.mes_ref !== mesFiltro) return false;
            if (funcFiltro !== "todos") {
              const cpfClean = (item.cpf || "").replace(/\D/g, "");
              const funcCpfClean = funcFiltro.replace(/\D/g, "");
              if (cpfClean && funcCpfClean) {
                if (cpfClean !== funcCpfClean) return false;
              } else if (item.funcionario_nome !== funcFiltro) {
                return false;
              }
            }
            if (searchTerm.trim() !== "") {
              const term = searchTerm.toLowerCase().trim();
              const termDigits = term.replace(/\D/g, "");
              const nomeMatch = item.funcionario_nome && item.funcionario_nome.toLowerCase().includes(term);
              const cpfMatch = termDigits !== "" && item.cpf && item.cpf.replace(/\D/g, "").includes(termDigits);
              const motivoMatch = item.motivo && item.motivo.toLowerCase().includes(term);
              if (!nomeMatch && !cpfMatch && !motivoMatch) return false;
            }
            return true;
          });
        }, [absenteismo, mesFiltro, funcFiltro, searchTerm]);

        
        // Colaboradores filtrados na modal de cadastro
        const colaboradoresFiltradosModal = useMemo(() => {
          if (!modalColabSearch.trim()) return colaboradores;
          const term = modalColabSearch.toLowerCase().trim();
          return colaboradores.filter((c) => {
            const nomeMatch = c.nome && c.nome.toLowerCase().includes(term);
            const cpfMatch = c.cpf && c.cpf.replace(/\D/g, "").includes(term.replace(/\D/g, ""));
            return nomeMatch || (term.replace(/\D/g, "") !== "" && cpfMatch);
          });
        }, [colaboradores, modalColabSearch]);

        // Auto-calculo de horas na modal
        
        // Atualiza a seleção quando a busca na modal altera
        useEffect(() => {
          if (isModalOpen && colaboradoresFiltradosModal.length > 0) {
            const exists = colaboradoresFiltradosModal.some(c => (c.cpf || c.nome) === selectedColabCpf);
            if (!exists) {
              setSelectedColabCpf(colaboradoresFiltradosModal[0].cpf || colaboradoresFiltradosModal[0].nome || "");
            }
          }
        }, [modalColabSearch, isModalOpen, colaboradoresFiltradosModal]);

        const colabSelecionadoObj = useMemo(() => {
          return colaboradores.find((c) => (c.cpf || "").replace(/\D/g, "") === selectedColabCpf.replace(/\D/g, ""));
        }, [colaboradores, selectedColabCpf]);

        const horasCalculadasAuto = useMemo(() => {
          const carga = colabSelecionadoObj ? colabSelecionadoObj.carga_horaria || 220 : 220;
          return calcularHorasUteisLocal(faltaForm.data_inicio, faltaForm.data_fim, carga);
        }, [faltaForm.data_inicio, faltaForm.data_fim, colabSelecionadoObj]);

        const handleOpenEdit = (item) => {
          item = absenteismo.find(original => original.id === item.id) || item;
          setEditAttachment(null);
          setRemoveEditAttachment(false);
          setEditItem({
            id: item.id,
            funcionario_id: item.funcionario_id,
            atestado_path: item.atestado_path,
            atestado_nome: item.atestado_nome,
            atestado_mime: item.atestado_mime,
            atestado_tipo: item.atestado_tipo||'atestado',
            atestado_data: item.atestado_data||item.data_inicio,
            atestado_dias: item.atestado_dias??'',
            funcionario_nome: item.funcionario_nome,
            data_inicio: item.data_inicio || "",
            data_fim: item.data_fim || "",
            horas_perdidas: item.horas_perdidas ?? "",
            motivo: item.motivo || "",
            carga_horaria: item.carga_horaria || 220,
          });
          setIsEditModalOpen(true);
        };

        const handleSalvarEdit = async (e) => {
          e.preventDefault();
          if (!editItem.id) return;

          setIsSaving(true);
          let uploaded=null;
          try {
            const parts = editItem.data_inicio.split("-");
            const mesRefCalculado = `${parts[1]}/${parts[0]}`;

            const payload = {
              data_inicio: editItem.data_inicio,
              data_fim: editItem.data_fim,
              mes_ref: mesRefCalculado,
              horas_perdidas: Number(editItem.horas_perdidas) || 0,
              motivo: editItem.motivo,
              carga_horaria: Number(editItem.carga_horaria) || 220,
            };
            if(editAttachment){
              uploaded=await RHAbsenceFiles.upload(supabase,editAttachment,editItem.funcionario_id);
              Object.assign(payload,uploaded);
            }else if(removeEditAttachment)Object.assign(payload,RHAbsenceFiles.empty);
            if(editAttachment||(editItem.atestado_path&&!removeEditAttachment))Object.assign(payload,RHAbsenceFiles.documentInfo({nome:editItem.funcionario_nome,inicio:editItem.data_inicio,fim:editItem.data_fim,tipo:editItem.atestado_tipo,data:editItem.atestado_data,dias:editItem.atestado_dias,mime:uploaded?.atestado_mime||editItem.atestado_mime}));

            const { data: updated, error } = await supabase
              .from("rh_absenteismo")
              .update(payload)
              .eq("id", editItem.id).select('id');

            if (error) throw error;
            if (!updated?.length) throw Error('Registro não atualizado. Confira seu acesso e tente novamente.');
            if((editAttachment||removeEditAttachment)&&editItem.atestado_path)await cleanupAttachment(editItem.atestado_path);
            uploaded=null;

            alert("Registro de absenteísmo atualizado com sucesso!");
            setIsEditModalOpen(false);
            fetchData();
          } catch (err) {
            if(uploaded)await cleanupAttachment(uploaded.atestado_path);
            console.error("Erro ao atualizar absenteísmo:", err);
            alert("Erro ao atualizar registro: " + err.message);
          } finally {
            setIsSaving(false);
          }
        };

        const handleExcluirAbsenteismo = async (id) => {
          if (!window.confirm("Deseja realmente excluir este registro de absenteísmo?")) return;
          try {
            const attachment=absenteismo.find(item=>item.id===id)?.atestado_path;
            const { data: removed, error } = await supabase.from("rh_absenteismo").delete().eq("id", id).select('id');
            if (error) throw error;
            if (!removed?.length) throw Error('Registro não excluído. Confira seu acesso e tente novamente.');
            await cleanupAttachment(attachment);
            alert("Registro excluído com sucesso!");
            fetchData();
          } catch (err) {
            console.error("Erro ao excluir registro:", err);
            alert("Erro ao excluir registro: " + err.message);
          }
        };

        const handleCadastrarFaltaSubmit = async (e) => {
          e.preventDefault();
          if (!selectedColabCpf || !colabSelecionadoObj) {
            alert("Selecione o colaborador.");
            return;
          }

          setIsSaving(true);
          let uploaded=null;
          try {
            const parts = faltaForm.data_inicio.split("-");
            const mesRefCalculado = `${parts[1]}/${parts[0]}`;

            const horasFinais = faltaForm.horas_perdidas_custom !== "" ? Number(faltaForm.horas_perdidas_custom) : horasCalculadasAuto;
            const motivoCompleto = faltaForm.observacao ? `${faltaForm.motivo_tipo} - ${faltaForm.observacao}` : faltaForm.motivo_tipo;

            const payload = {
              funcionario_id: colabSelecionadoObj.id,
              funcionario_nome: colabSelecionadoObj.nome,
              cpf: colabSelecionadoObj.cpf ? colabSelecionadoObj.cpf.replace(/\D/g, "") : "",
              data_inicio: faltaForm.data_inicio,
              data_fim: faltaForm.data_fim,
              mes_ref: mesRefCalculado,
              horas_perdidas: horasFinais,
              motivo: motivoCompleto,
              carga_horaria: colabSelecionadoObj.carga_horaria || 220,
            };
            if(faltaAttachment){
              const info=RHAbsenceFiles.documentInfo({nome:colabSelecionadoObj.nome,inicio:faltaForm.data_inicio,fim:faltaForm.data_fim,...faltaDocument,mime:(await RHAbsenceFiles.validate(faltaAttachment)).mime});
              uploaded=await RHAbsenceFiles.upload(supabase,faltaAttachment,colabSelecionadoObj.id);
              Object.assign(payload,uploaded,info);
            }

            const { error } = await supabase.from("rh_absenteismo").insert([payload]);
            if (error) throw error;
            uploaded=null;
            setFaltaAttachment(null);

            alert("Falta/Afastamento cadastrado com sucesso!");
            setIsModalOpen(false);
            setFaltaForm({
              data_inicio: RH.today(),
              data_fim: RH.today(),
              motivo_tipo: "Com Atestado Médico",
              observacao: "",
              horas_perdidas_custom: "",
            });
            fetchData();
          } catch (err) {
            if(uploaded)await cleanupAttachment(uploaded.atestado_path);
            console.error("Erro ao cadastrar falta:", err);
            alert("Erro ao cadastrar falta: " + err.message);
          } finally {
            setIsSaving(false);
          }
        };

        const gerarPDF = () => {
          const container = document.createElement("div");
          container.id = "pdf-content-absenteismo";
          container.style.position = "absolute";
          container.style.left = "0";
          container.style.opacity = "0";
          container.style.pointerEvents = "none";
          container.style.zIndex = "-9999";
          container.style.top = "0";

          let tableRows = dadosFiltrados
            .map(
              (item) => `
            <tr style="border-bottom: 1px solid #e2e8f0; page-break-inside: avoid;">
              <td style="padding: 12px 16px; font-size: 10px;">${item.funcionario_nome}</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${formatarData(item.data_inicio)}</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${formatarData(item.data_fim)}</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${item.mes_ref || "-"}</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center;">${item.carga_horaria || 220}h</td>
              <td style="padding: 12px 16px; font-size: 10px; text-align: center; color: #ef4444; font-weight: bold;">${item.horas_perdidas ? item.horas_perdidas + "h" : "-"}</td>
              <td style="padding: 12px 16px; font-size: 10px; color: #475569;">${item.motivo || "Não informado"}</td>
            </tr>
          `
            )
            .join("");

          if (dadosFiltrados.length === 0) {
            tableRows = `<tr><td colspan="7" style="padding: 20px; text-align: center; color: #64748b;">Nenhum registro encontrado.</td></tr>`;
          }

          const dataEmissao = new Date().toLocaleDateString("pt-BR");
          const periodo = mesFiltro === "todos" ? "Todos os Períodos" : mesFiltro;

          container.innerHTML = `
            <div id="pdf-inner-content-absenteismo" style="width: 1080px; background-color: white; color: black; font-family: sans-serif; padding: 20px;">
              <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #002060; padding-bottom: 10px;">
                <h2 style="margin: 0; color: #002060; font-size: 18px;">PRIME RH - Relatório de Absenteísmo</h2>
                <p style="margin: 5px 0 0 0; color: #64748b; font-size: 12px;">Período: ${periodo} | Emitido em: ${dataEmissao}</p>
              </div>
              <div style="margin-bottom: 20px;">
                <p style="font-size: 12px; color: #334155; font-weight: bold;">Total de Horas Perdidas: <span style="color: #ef4444;">${totais.horas_perdidas}h</span></p>
              </div>
              <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead style="background-color: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                  <tr>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase;">Funcionário</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Data Início</th>
                    <th style="padding: 12px 16px; font-size: 10px; color: #475569; text-transform: uppercase; text-align: center;">Data Fim</th>

                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data Fim *</label>
                        <input
                          type="date"
                          required
                          value={faltaForm.data_fim}
                          onChange={(e) => setFaltaForm({ ...faltaForm, data_fim: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Tipo de Falta / Motivo *</label>
                      <select
                        value={faltaForm.motivo_tipo}
                        onChange={(e) => {setFaltaForm({ ...faltaForm, motivo_tipo: e.target.value });if(e.target.value==='Declaração de Comparecimento'||e.target.value==='Com Atestado Médico')setFaltaDocument({...faltaDocument,tipo:e.target.value==='Declaração de Comparecimento'?'comparecimento':'atestado'});}}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      >
                        <option value="Com Atestado Médico">Com Atestado Médico</option>
                        <option value="Declaração de Comparecimento">Declaração de Comparecimento</option>
                        <option value="Falta Não Justificada (Sem Atestado)">Falta Não Justificada (Sem Atestado)</option>
                        <option value="Falta Justificada">Falta Justificada</option>
                        <option value="Afastamento Inss / Licença">Afastamento INSS / Licença</option>
                        <option value="Suspensão">Suspensão</option>
                      </select>
                    </div>

                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-slate-700">Cálculo Automático de Horas Úteis:</span>
                        <span className="text-base font-black text-red-600">{horasCalculadasAuto} horas</span>
                      </div>
                      <p className="text-[10px] text-slate-500 mt-1">
                        Considera 8h/dia (seg-sex) e 4h (sáb) proporcional à carga horária do colaborador.
                      </p>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Alterar Horas Perdidas Manualmente (Opcional)</label>
                      <input
                        type="number"
                        step="0.5"
                        placeholder={`Deixe em branco para usar automático (${horasCalculadasAuto}h)`}
                        value={faltaForm.horas_perdidas_custom}
                        onChange={(e) => setFaltaForm({ ...faltaForm, horas_perdidas_custom: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Observações Adicionais</label>
                      <input
                        type="text"
                        placeholder="Ex: Atestado de 2 dias"
                        value={faltaForm.observacao}
                        onChange={(e) => setFaltaForm({ ...faltaForm, observacao: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                      />
                    </div>

                    <div className="space-y-2">
                      <label htmlFor="novoAtestado" className="block font-bold text-slate-700 uppercase">Anexar atestado / documento (opcional)</label>
                      <input id="novoAtestado" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" disabled={isSubmitting} onChange={e=>chooseAttachment(e,setFaltaAttachment)} className="block w-full text-sm" />
                      {faltaAttachment&&<div className="space-y-3 pt-2">
                        <div><label htmlFor="newDocType" className="block font-bold mb-1">Tipo de documento</label>
                          <select id="newDocType" disabled={isSubmitting} value={faltaDocument.tipo} onChange={e=>{setFaltaDocument({...faltaDocument,tipo:e.target.value});setFaltaForm({...faltaForm,motivo_tipo:e.target.value==='comparecimento'?'Declaração de Comparecimento':'Com Atestado Médico'});}} className="w-full p-2.5 border rounded-xl"><option value="atestado">Atestado</option><option value="comparecimento">Comparecimento</option></select>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div><label htmlFor="newDocDate" className="block font-bold mb-1">Data do documento</label><input id="newDocDate" type="date" required disabled={isSubmitting} value={faltaDocument.data||faltaForm.data_inicio} onChange={e=>setFaltaDocument({...faltaDocument,data:e.target.value})} className="w-full p-2.5 border rounded-xl" /></div>
                          {faltaDocument.tipo==='atestado'&&<div><label htmlFor="newDocDays" className="block font-bold mb-1">Dias do atestado</label><input id="newDocDays" type="number" min="1" max="3660" step="1" disabled={isSubmitting} value={faltaDocument.dias} placeholder="Dias do período" onChange={e=>setFaltaDocument({...faltaDocument,dias:e.target.value})} className="w-full p-2.5 border rounded-xl" /></div>}
                        </div>
                        <p className="text-slate-500 break-words">Nome: {documentPreview(colabSelecionadoObj?.nome,faltaForm.data_inicio,faltaForm.data_fim,faltaDocument,faltaAttachment.type)}</p>
                        {faltaDocument.tipo==='comparecimento'&&<p className="text-slate-500">Confira as horas perdidas acima conforme a duração do comparecimento.</p>}
                      </div>}
                      <p className="text-slate-500">JPG, PNG ou PDF de até 10 MB. Destino: pasta do colaborador / ATESTADOS / ano da data do documento. Acesso restrito.</p>
                    </div>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        disabled={isSubmitting} onClick={() => setIsModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 text-white bg-[#002060] hover:bg-[#001848] rounded-xl font-bold flex items-center gap-2 shadow-sm"
                      >
                        {isSubmitting ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Cadastrar Falta
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
