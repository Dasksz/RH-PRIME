      // ==========================================
      // 3. APLICATIVO REACT PRINCIPAL
      // ==========================================
      function App() {
        const [employees, setEmployees] = useState([]);
        const [devolucoes, setDevolucoes] = useState([]);
        const [selectedDevolucaoId, setSelectedDevolucaoId] = useState(null);
        const [checkedDevolucaoItems, setCheckedDevolucaoItems] = useState({});
        const [epiFuncaoRules, setEpiFuncaoRules] = useState([]);
        const [isLoadingData, setIsLoadingData] = useState(true);
        const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
        const [adminPasswordInput, setAdminPasswordInput] = useState("");
        const [adminPasswordError, setAdminPasswordError] = useState("");
        const [isConfirmDevolucaoModalOpen, setIsConfirmDevolucaoModalOpen] = useState(false);
        const [itemToDevolver, setItemToDevolver] = useState(null);

        const [isAuthChecking, setIsAuthChecking] = useState(true);

        useEffect(() => {
          checkUser();
        }, []);

        async function checkUser() {
          try {
            const {
              data: { session },
            } = await supabase.auth.getSession();
            if (!session) {
              window.location.href = "login.html";
              return;
            }

            const { data: profile } = await supabase
              .from("profiles")
              .select("status")
              .eq("id", session.user.id)
              .single();

            if (!profile || profile.status !== "aprovado") {
              window.location.href = "login.html";
              return;
            }

            setIsAuthChecking(false);
          } catch (error) {
            console.error("Error checking auth:", error);
            window.location.href = "login.html";
          }
        }

        const handleLogout = async () => {
          await supabase.auth.signOut();
          window.location.href = "login.html";
        };

        // Helper to calculate status based on date
        const calculateStatus = (dateStr, nowTime) => {
          if (!dateStr) return "pendente";

          const trimmedDateStr = dateStr.trim();
          if (trimmedDateStr === "") return "pendente";

          let dateObj;

          const slash1 = trimmedDateStr.indexOf("/");
          if (slash1 !== -1) {
            const slash2 = trimmedDateStr.indexOf("/", slash1 + 1);
            if (slash2 !== -1) {
              // format is DD/MM/YYYY
              dateObj = new Date(
                trimmedDateStr.substring(slash2 + 1),
                trimmedDateStr.substring(slash1 + 1, slash2) - 1,
                trimmedDateStr.substring(0, slash1),
              );
            } else {
              dateObj = new Date(trimmedDateStr);
            }
          } else {
            const dash1 = trimmedDateStr.indexOf("-");
            if (dash1 !== -1) {
              const dash2 = trimmedDateStr.indexOf("-", dash1 + 1);
              if (dash2 !== -1) {
                // format might be YYYY-MM-DD
                dateObj = new Date(
                  trimmedDateStr.substring(0, dash1),
                  trimmedDateStr.substring(dash1 + 1, dash2) - 1,
                  trimmedDateStr.substring(dash2 + 1),
                );
              } else {
                dateObj = new Date(trimmedDateStr);
              }
            } else {
              dateObj = new Date(trimmedDateStr);
            }
          }

          const time = dateObj.getTime();
          if (isNaN(time)) return "pendente";

          const diffTime = Math.abs(nowTime - time);
          const diffDays = Math.ceil(diffTime / 86400000); // 1000 * 60 * 60 * 24

          return diffDays < 180 ? "em_dia" : "vencido";
        };

        const getEmpresaInfo = (localRegistro, empresasList = []) => {
          if (!localRegistro) {
            const def = empresasList.find((e) => e.nome && e.nome.toUpperCase().includes("NUNES")) || empresasList[0];
            return def ? { nome: def.nome, cnpj: def.cnpj } : { nome: "NUNES & VIEIRA LOGISTICA LTDA", cnpj: "48.986.353/0001-39" };
          }

          const str = localRegistro.toString().trim().toUpperCase();

          if (str.includes("JEQUIÉ") || str.includes("JEQUIE")) {
            const eq = empresasList.find(
              (e) => e.cnpj?.includes("0002-82") || (e.endereco && (e.endereco.toUpperCase().includes("JEQUIÉ") || e.endereco.toUpperCase().includes("JEQUIE")))
            );
            if (eq) return { nome: eq.nome, cnpj: eq.cnpj };
            return { nome: "PRIME DISTRIBUICAO LTDA", cnpj: "52.522.019/0002-82" };
          }

          if (str.includes("ILHÉUS") || str.includes("ILHEUS")) {
            const eq = empresasList.find(
              (e) => e.cnpj?.includes("0001-00") || (e.endereco && (e.endereco.toUpperCase().includes("ILHÉUS") || e.endereco.toUpperCase().includes("ILHEUS")))
            );
            if (eq) return { nome: eq.nome, cnpj: eq.cnpj };
            return { nome: "PRIME DISTRIBUICAO LTDA", cnpj: "52.522.019/0001-00" };
          }

          if (str.includes("NUNES") || str.includes("ITABUNA") || str.includes("VIEIRA")) {
            const eq = empresasList.find(
              (e) => e.cnpj?.includes("0001-39") || (e.nome && e.nome.toUpperCase().includes("NUNES"))
            );
            if (eq) return { nome: eq.nome, cnpj: eq.cnpj };
            return { nome: "NUNES & VIEIRA LOGISTICA LTDA", cnpj: "48.986.353/0001-39" };
          }

          return { nome: "NUNES & VIEIRA LOGISTICA LTDA", cnpj: "48.986.353/0001-39" };
        };

        const formatarDataBonita = (dateVal) => {
          if (!dateVal) return "-";
          const str = dateVal.toString().trim();
          if (!str) return "-";

          if (str.includes("GMT") || str.includes("T")) {
            const d = new Date(str);
            if (!isNaN(d.getTime())) {
              const dia = d.getDate().toString().padStart(2, "0");
              const mes = (d.getMonth() + 1).toString().padStart(2, "0");
              const ano = d.getFullYear();
              return `${dia}/${mes}/${ano}`;
            }
          }

          const partsDash = str.split("-");
          if (partsDash.length === 3) {
            if (partsDash[0].length === 4) {
              return `${partsDash[2].substring(0, 2)}/${partsDash[1]}/${partsDash[0]}`;
            }
          }

          const partsSlash = str.split("/");
          if (partsSlash.length === 3) {
            return `${partsSlash[0].padStart(2, "0")}/${partsSlash[1].padStart(2, "0")}/${partsSlash[2]}`;
          }

          return str;
        };

        const mapDataToState = (data) => {
          const nowTime = Date.now();

          return data.map((row) => {
            const name = row.nome || "";

            let initials = "??";
            const trimmedName = name.trim();
            if (trimmedName) {
              const firstChar = trimmedName[0];
              const lastSpaceIndex = trimmedName.lastIndexOf(" ");
              if (
                lastSpaceIndex !== -1 &&
                lastSpaceIndex < trimmedName.length - 1
              ) {
                initials = firstChar + trimmedName[lastSpaceIndex + 1];
              } else {
                initials =
                  trimmedName.length > 1
                    ? trimmedName.substring(0, 2)
                    : firstChar;
              }
            }

            const epiData = row.epi_data;
            const fardamentoData = row.fardamento_data;

            const epiDataTrimmed = epiData ? epiData.trim() : "";
            const fardamentoDataTrimmed = fardamentoData
              ? fardamentoData.trim()
              : "";

            return {
              id: row.id,
              nome: name,
              nomeLower: name.toLowerCase(),
              cargo: row.funcao || "Não especificado",
              setor: row.setor || "Não especificado",
              cpf: row.cpf || "Não informado",
              unidade: row.unidade || "Padrão",
              local_registro: row.local_registro || "",
              admissao: row.admissao || "",
              avatar: initials.toUpperCase(),
              epi: {
                status: calculateStatus(epiData, nowTime),
                ultimaEntrega: epiDataTrimmed !== "" ? epiDataTrimmed : null,
                validade: "180 dias",
                link: row.epi_link || null,
                itens: row.epi_itens || null,
              },
              fardamento: {
                status: calculateStatus(fardamentoData, nowTime),
                ultimaEntrega:
                  fardamentoDataTrimmed !== "" ? fardamentoDataTrimmed : null,
                validade: "1 ano",
                link: row.fardamento_link || null,
                itens: row.fardamento_itens || null,
              },
            };
          });
        };

        const fetchEpiFuncaoRules = async () => {
          try {
            const { data, error } = await supabase
              .from("epi_funcao")
              .select("*");
            if (error) throw error;
            if (data) setEpiFuncaoRules(data);
          } catch (err) {
            console.error("Failed to fetch epi_funcao rules:", err);
          }
        };

        const fetchEmpresas = async () => {
          try {
            const { data, error } = await supabase
              .from("empresas")
              .select("*")
              .order("id", { ascending: true });
            if (error) throw error;
            setEmpresas(data);
            if (data.length > 0) {
              const defaultEmp =
                data.find((e) => e.nome.includes("NUNES")) || data[0];
              setSelectedEmpresaId(defaultEmp.id);
            }
          } catch (error) {
            console.error("Error fetching empresas:", error);
          }
        };

        const fetchDevolucoes = async () => {
          try {
            const { data, error } = await supabase
              .from("devolucoes_pendentes")
              .select("*")
              .order("created_at", { ascending: false });
            if (error) throw error;
            const initialDev = data || [];
            setDevolucoes(initialDev);
            const initialCheckedMap = {};
            initialDev.forEach((d) => {
              if (d.itens_checked && typeof d.itens_checked === "object") {
                initialCheckedMap[d.id] = d.itens_checked;
              }
            });
            setCheckedDevolucaoItems(initialCheckedMap);
          } catch (err) {
            console.error("Error fetching devolucoes:", err);
          }
        };

        const fetchEmployees = async () => {
          try {
            const { data, error } = await supabase
              .from("funcionarios_epi")
              .select("*")
              .order("nome", { ascending: true });

            if (error) throw error;

            if (data) {
              setEmployees(mapDataToState(data));
            }
          } catch (err) {
            console.error("Failed to fetch from Supabase table:", err);
          } finally {
            setIsLoadingData(false);
          }
        };

        useEffect(() => {
          if (!isAuthChecking) {
            fetchEmployees();
            fetchEmpresas();
            fetchEpiFuncaoRules();
            fetchDevolucoes();

            const channel = supabase
              .channel("schema-db-changes")
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "funcionarios_epi" },
                (payload) => {
                  fetchEmployees();
                  fetchEpiFuncaoRules();
                },
              )
              .subscribe();

            return () => {
              supabase.removeChannel(channel);
            };
          }
        }, [isAuthChecking]);

        const [searchTerm, setSearchTerm] = useState("");
        const [selectedEmpId, setSelectedEmpIdState] = useState(null);
        const setSelectedEmpId = (id) => {
          setSelectedEmpIdState(id);
          if (id) {
            window.history.pushState(
              { viewMode: "controle", selectedEmpId: id },
              "",
              "",
            );
          } else {
            window.history.pushState(
              { viewMode: "controle", selectedEmpId: null },
              "",
              "",
            );
          }
        };
        const [activeTab, setActiveTab] = useState("epi");
        const [dashboardFilter, setDashboardFilter] = useState("geral");
        const [statusFilter, setStatusFilter] = useState("todos");
        const [viewMode, setViewModeState] = useState("dashboard");

        const getEmployeeStatus = (emp) => {
          if (dashboardFilter === "epi") {
            if (!emp.epi.ultimaEntrega) return "sem_entrega";
            if (emp.epi.status === "vencido") return "vencido";
            return "em_dia";
          }
          if (dashboardFilter === "fardamento") {
            if (!emp.fardamento.ultimaEntrega) return "sem_entrega";
            if (emp.fardamento.status === "vencido") return "vencido";
            return "em_dia";
          }
          if (!emp.epi.ultimaEntrega && !emp.fardamento.ultimaEntrega)
            return "sem_entrega";
          if (
            emp.epi.status === "vencido" ||
            emp.fardamento.status === "vencido"
          )
            return "vencido";
          return "em_dia";
        };

        const filteredEmployees = useMemo(() => {
          const lowerSearch = searchTerm.toLowerCase();
          return employees.filter((emp) => {
            const matchesSearch = emp.nomeLower.includes(lowerSearch);
            if (!matchesSearch) return false;
            if (statusFilter === "todos") return true;
            return getEmployeeStatus(emp) === statusFilter;
          });
        }, [employees, searchTerm, statusFilter, dashboardFilter]);

        const selectedEmployee = useMemo(() => {
          return employees.find((emp) => emp.id === selectedEmpId);
        }, [employees, selectedEmpId]);

        const kpis = useMemo(() => {
          let emDia = 0,
            vencidos = 0,
            semRegistro = 0;
          employees.forEach((emp) => {
            const status = getEmployeeStatus(emp);
            if (status === "sem_entrega") semRegistro++;
            else if (status === "vencido") vencidos++;
            else if (status === "em_dia") emDia++;
          });
          const taxaConformidade =
            employees.length > 0
              ? Math.round((emDia / employees.length) * 100)
              : 0;
          return { emDia, vencidos, semRegistro, taxaConformidade };
        }, [employees, dashboardFilter]);

        if (isAuthChecking || isLoadingData) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-gray-50">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
          );
        }

        return (
          <div className="flex flex-col min-h-screen bg-[#F8FAFC]">
            <header className="bg-[#002060] text-white px-5 py-4 flex items-center justify-between shadow-md sticky top-0 z-50">
              <div className="flex items-center gap-3 cursor-pointer group" onClick={() => { setIsAdminModalOpen(true); setAdminPasswordError(""); setAdminPasswordInput(""); }} title="Clique para abrir Área Restrita do Administrador">
                <Shield size={28} className="text-[#E30613] group-hover:scale-110 transition-transform" />
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight leading-none group-hover:text-red-200 transition-colors">
                    PRIME RH
                  </h1>
                  <p className="text-blue-200 text-[10px] font-semibold uppercase tracking-widest mt-1">
                    Gestão de Segurança
                  </p>
                </div>
              </div>

              {/* Nav Desktop */}
              <nav className="hidden md:flex items-center gap-6">
                <span className="text-sm font-bold text-white border-b-2 border-[#E30613] pb-1">
                  EPI/Fardamento
                </span>
                <a
                  href="colaboradores.html"
                  className="text-sm font-medium text-slate-300 hover:text-white transition-colors"
                >
                  Colaboradores
                </a>
                <a
                  href="ferias.html"
                  className="text-sm font-medium text-slate-300 hover:text-white transition-colors"
                >
                  Férias
                </a>
                <a
                  href="indicadores.html"
                  className="text-sm font-medium text-slate-300 hover:text-white transition-colors"
                >
                  Indicadores
                </a>
                <button
                  onClick={handleLogout}
                  className="flex items-center gap-2 text-red-300 hover:text-white ml-4 text-sm font-medium"
                >
                  Sair
                </button>
              </nav>

              <button
                className="md:hidden p-2 text-white"
                onClick={() =>
                  document
                    .getElementById("mobile-nav")
                    .classList.toggle("hidden")
                }
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
