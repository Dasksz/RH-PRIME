<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script><script src="../rh-experience.js"></script><script src="../rh-profiles.js"></script><div id="root"></div>
<script>
const profiles=[{id:'manager',name:'Gestor de exemplo',email:'gestor@example.test',role:'supervisor',status:'aprovado',access_mode:'todos',access_level:'consulta',access_scopes:[],access_version:1,whatsapp:'5511999999999',experience_notifications:true}];

</script></html>
