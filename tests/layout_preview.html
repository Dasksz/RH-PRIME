<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RH PRIME — teste de layout</title><style>body{font:16px system-ui;margin:20px;background:#e2e8f0;color:#0f172a}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:10px;border:1px solid #64748b;border-radius:8px}iframe{border:2px solid #334155;display:block;background:white;height:1000px;margin-top:16px}#status{white-space:pre-wrap}h1{font-size:22px}</style><h1>Prévia de layout com dados fictícios</h1><p>Este teste simula o login e o banco. Não envia alterações ou documentos reais.</p><header><select id="page"><option value="index.html">index</option><option value="colaboradores.html">colaboradores</option><option value="ferias.html">ferias</option><option value="detalhes_absenteismo.html">detalhes_absenteismo</option><option value="indicadores.html">indicadores</option><option value="admin.html">admin</option><option value="login.html">login</option></select><button data-width="390">Celular 390px</button><button data-width="820">Tablet 820px</button><button data-width="1440">PC 1440px</button></header><p id="status">Preparando...</p><iframe id="preview" width="390" title="Prévia do sistema"></iframe><script>
const MOCK="(()=>{const fixtures={\"profiles\":[{\"id\":\"u1\",\"name\":\"ADMIN TESTE\",\"email\":\"teste@example.invalid\",\"status\":\"admin\"}],\"funcionarios_epi\":[{\"id\":\"e1\",\"nome\":\"COLABORADOR DE TESTE\",\"cpf\":\"12345678901\",\"admissao\":\"01/01/2025\",\"funcao\":\"MOTORISTA\",\"setor\":\"OPERAÇÃO\",\"unidade\":\"SALVADOR\",\"carga_horaria\":110,\"local_registro\":\"EMPRESA TESTE\",\"validacao\":\"☑ OK\",\"epi_itens\":\"CAPACETE\",\"epi_data\":\"01/09/2026\",\"data_desligamento\":null}],\"empresas\":[{\"id\":1,\"nome\":\"EMPRESA TESTE\",\"cnpj\":\"12345678000199\"}],\"epi_funcao\":[{\"funcao\":\"MOTORISTA\",\"capacete\":true}],\"rh_movimentacoes\":[{\"id\":1,\"funcionario_id\":\"e1\",\"funcionario_nome\":\"COLABORADOR DE TESTE\",\"cpf\":\"12345678901\",\"data_admissao\":\"2025-01-01\",\"carga_horaria\":110}],\"rh_absenteismo\":[{\"id\":1,\"funcionario_id\":\"e1\",\"funcionario_nome\":\"COLABORADOR DE TESTE\",\"cpf\":\"12345678901\",\"data_inicio\":\"2026-09-30\",\"data_fim\":\"2026-10-01\",\"horas_perdidas\":2,\"carga_horaria\":110,\"mes_ref\":\"09/2026\",\"motivo\":\"Consulta\"}],\"rh_ferias\":[{\"id\":1,\"funcionario_id\":\"e1\",\"funcionario_nome\":\"COLABORADOR DE TESTE\",\"cpf\":\"12345678901\",\"data_inicio_aquisitivo\":\"2025-01-01\",\"data_fim_aquisitivo\":\"2025-12-31\",\"data_vencimento\":\"2026-11-30\",\"dias_direito\":30,\"dias_gozados\":0,\"dias_abonados\":0,\"dias_saldo\":30,\"status\":\"pendente\"}],\"devolucoes_pendentes\":[],\"sistema_logs\":[],\"rh_desligados\":[]};const client={auth:{getSession:async()=>({data:{session:{user:{id:'u1',email:'teste@example.invalid'}}}}),signOut:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),updateUser:async()=>({data:{},error:null})},from(table){let data=fixtures[table]||[];let single=false;const q={select(){return q},order(){return q},range(){return q},eq(k,v){data=data.filter(x=>x[k]===v);return q},is(k,v){data=data.filter(x=>(x[k]??null)===v);return q},single(){single=true;return q},limit(){return q},then(resolve,reject){return Promise.resolve({data:single?data[0]:data,error:null}).then(resolve,reject)}};for(const op of ['insert','update','delete','upsert'])q[op]=()=>{window.__mutations.push({table,op});return q;};return q},channel(){const c={on(){return c},subscribe(){return c}};return c},removeChannel(){}};window.__mutations=[];window.supabase={createClient:()=>client};})();";
const frame=document.getElementById('preview'),pages=document.getElementById('page'),status=document.getElementById('status');
let generation=0;
async function render(){const current=++generation,file=pages.value,width=frame.width;status.textContent='Carregando '+file;const base=new URL('../',location.href).href;let html=await (await fetch(base+file,{cache:'no-store'})).text();let script=MOCK;if(file==='login.html')script+='window.supabase.createClient().auth.getSession=async()=>({data:{session:null}});';html=html.replace('<html', '<html data-rh-preview="'+file+'"').replace(/<head>/,'<head><base href="'+base+'">').replace(/<script[^>]*src="https:\/\/cdn.jsdelivr.net\/npm\/@supabase[^>]*>[\s\S]*?<\/script>/g,'<script>'+script+'<\/script>');frame.onload=()=>setTimeout(()=>{if(current!==generation)return;try{const doc=frame.contentDocument;if(doc.documentElement.getAttribute('data-rh-preview')!==file)return;status.textContent=file+' | largura '+width+'px | conteúdo '+doc.documentElement.scrollWidth+'px | texto '+doc.body.innerText.length+' caracteres';}catch(e){status.textContent=e.message;}},2000);frame.srcdoc=html;}
pages.onchange=render;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;render();});render();
</script></html>
