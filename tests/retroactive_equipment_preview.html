<!doctype html><html lang="pt-BR" data-rh-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia de entrega histórica</title><link rel="stylesheet" href="../assets/css/rh-utilities.css"><link rel="stylesheet" href="../assets/css/rh-responsive.css"><link rel="stylesheet" href="../assets/css/rh-equipamentos.css"><link rel="stylesheet" href="../assets/css/rh-theme.css"><style>body{margin:0;font:15px system-ui}header{padding:20px}#root{max-width:1100px;margin:auto}</style></head><body><header>PRÉVIA · Dados fictícios, sem conexão com o banco · Estoque zerado</header><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="../assets/js/rh-core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="../assets/js/rh-ficha-padrao.js"></script><script src="../assets/js/rh-equipamentos.js"></script><script>
const employee={id:'10000000-0000-4000-8000-000000000001',nome:'COLABORADOR DE TESTE',cpf:'00000000000',funcao:'TESTE',unidade:'FILIAL 5',local_registro:'EMPRESA TESTE'};
const products=[{id:'epi',nome:'BOTA',categoria:'epi',tamanhos:['40'],funcoes:[],todas_funcoes:true,ativo:true},{id:'farda',nome:'CAMISA',categoria:'fardamento',tamanhos:['M'],funcoes:[],todas_funcoes:true,ativo:true}],stock=products.map(p=>({produto_id:p.id,filial:'FILIAL 5',tamanho:p.tamanhos[0],quantidade:0})),movements=[],receipts=[];
const client={from(table){let data=table==='rh_products'?products:table==='rh_stock'?stock:table==='rh_equipment_current'?movements:table==='rh_equipment_receipts'?receipts:[];let one=false;const q={select(){return q},order(){return q},range(a,b){data=data.slice(a,b+1);return q},limit(n){data=data.slice(0,n);return q},eq(k,v){data=data.filter(r=>r[k]===v);return q},single(){one=true;return q},then(fn){return Promise.resolve({data:structuredClone(one?data[0]:data),error:null}).then(fn)}};return q},async rpc(name,p){if(name!=='rh_registrar_equipamentos')return {error:{message:'Ação indisponível na prévia'}};const old=receipts.find(r=>r.id===p.p_operacao);if(old)return {data:structuredClone(old)};for(const item of p.p_itens){if(item.acao)return {error:{message:'Apenas entregas na prévia'}};const balance=stock.find(s=>s.produto_id===products.find(p=>p.nome===item.equipamento)?.id);if(item.sem_desconto_estoque&&item.data>=RH.today())return {error:{message:'Somente entregas anteriores a hoje'}};if(!item.sem_desconto_estoque&&balance.quantidade<item.quantidade)return {error:{message:'Estoque insuficiente'}};}
for(const item of p.p_itens){const product=products.find(p=>p.nome===item.equipamento);if(!item.sem_desconto_estoque)stock.find(s=>s.produto_id===product.id).quantidade-=item.quantidade;movements.push({...item,id:crypto.randomUUID(),funcionario_id:employee.id,operacao_id:p.p_operacao,categoria:p.p_categoria,tipo:'entrega',descricao:item.equipamento,data_movimento:item.data,created_at:new Date().toISOString(),registrado_por:'Teste',produto_id:product.id,estoque_descontado:!item.sem_desconto_estoque});}const receipt={id:p.p_operacao,funcionario_id:employee.id,categoria:p.p_categoria,created_at:new Date().toISOString(),snapshot:{colaborador:employee,empresa:{nome:'EMPRESA TESTE'},categoria:p.p_categoria,movimentos:structuredClone(movements),verificacoes:[],correcoes:[]}};receipts.push(receipt);return {data:structuredClone(receipt)};}};
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(RHEquipment.Control,{client,employee}));
</script></body></html>
