<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Prévia de equipamentos — dados fictícios</title><link rel="stylesheet" href="../rh-equipamentos.css"><link rel="stylesheet" href="../rh-theme.css"><style>body{margin:0;font:15px system-ui}header{padding:20px}#root{max-width:1200px;margin:auto}</style><header>PRÉVIA — COLABORADOR DE TESTE · Dados fictícios, sem conexão com o banco</header><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="../rh-core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="../rh-equipamentos.js"></script><script>
const movements=[{id:'11111111-1111-4111-8111-111111111111',funcionario_id:'emp',operacao_id:'old',categoria:'epi',tipo:'entrega',equipamento:'PROTETOR DORSAL',complemento:'tamanho M',descricao:'PROTETOR DORSAL - tamanho M',ca:'',quantidade:1,data_movimento:'2026-08-04',created_at:'2026-08-04T12:00:00Z'},{id:'22222222-2222-4222-8222-222222222222',funcionario_id:'emp',operacao_id:'old',categoria:'epi',tipo:'entrega',equipamento:'BOTA MARLUVAS',complemento:'',descricao:'BOTA MARLUVAS',ca:'43377',quantidade:1,data_movimento:'2026-08-04',legado:true,created_at:'2026-08-04T12:00:00Z'}],receipts=[];

const client={from(table){let rows=table==='rh_equipment_movements'?movements:receipts;let single=false;const q={select(){return q},range(){return q},eq(k,v){rows=rows.filter(x=>x[k]===v);return q},order(){return q},limit(){return q},single(){single=true;return q},then(fn){return Promise.resolve({data:single?rows[0]:rows,error:null}).then(fn)}};return q},async rpc(name,p){let receipt=receipts.find(r=>r.id===p.p_operacao);if(receipt)return {data:receipt};const common={funcionario_id:'emp',categoria:p.p_categoria,operacao_id:p.p_operacao,created_at:new Date().toISOString()};if(p.p_devolucao){const d=p.p_devolucao,original=movements.find(m=>m.id===d.origem);movements.push({...original,...common,id:crypto.randomUUID(),tipo:d.tipo,entrega_origem_id:d.origem,quantidade:d.quantidade,motivo:d.motivo,observacao:d.observacao,data_movimento:d.data});}for(const it of p.p_itens){movements.push({...common,...it,id:crypto.randomUUID(),tipo:'entrega',descricao:it.equipamento+(it.complemento?' - '+it.complemento:''),data_movimento:it.data,entrega_origem_id:p.p_devolucao?.origem});}receipt={id:p.p_operacao,funcionario_id:'emp',categoria:p.p_categoria,created_at:new Date().toISOString(),snapshot:{colaborador:employee,empresa:{nome:'EMPRESA TESTE'},categoria:p.p_categoria,movimentos:JSON.parse(JSON.stringify(movements.filter(m=>m.categoria===p.p_categoria)))}};receipts.push(receipt);return {data:receipt};}};

</script></html>
