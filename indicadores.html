    <script type="text/babel" data-type="text/javascript" data-presets="react">
      const { useState, useMemo, useEffect, useRef } = React;

      // Configuração do Supabase
      const SUPABASE_URL = "https://gcksbfstheavpfgcdndb.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdja3NiZnN0aGVhdnBmZ2NkbmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTA3MjcsImV4cCI6MjA5MzMyNjcyN30.5yqzDt5mTJRpTavKq4GJ0CwX6qT3GaVvXqbcdawJUmU";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // ==========================================
      // 1. ÍCONES (Componentes SVG Nativos)
      // ==========================================
      const Icon = ({ size = 24, className = "", children }) => (
        <svg

      const Shield = (p) => (

      const Search = (p) => (

      const Plus = (p) => (

      );
      const AlertCircle = (p) => (
        <Icon {...p}>
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />

      const CheckCircle2 = (p) => (
        <Icon {...p}>
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </Icon>
      );
      const User = (p) => (
        <Icon {...p}>
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </Icon>
      );
      const Calendar = (p) => (
        <Icon {...p}>
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </Icon>
      );
      const LinkIcon = (p) => (
        <Icon {...p}>
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </Icon>
      );
      const Trash2 = (p) => (
        <Icon {...p}>
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <line x1="10" y1="11" x2="10" y2="17" />
          <line x1="14" y1="11" x2="14" y2="17" />
        </Icon>
      );
      const ListPlus = (p) => (
        <Icon {...p}>
          <path d="M11 12H3" />
          <path d="M16 6H3" />
          <path d="M16 18H3" />
          <path d="M18 9v6" />
          <path d="M21 12h-6" />
        </Icon>
      );
      const CheckCheck = (p) => (
        <Icon {...p}>
          <polyline points="18 6 7 17 2 12" />
          <polyline points="22 10 11 21 6 16" />
        </Icon>
      );
      const Users = (p) => (
        <Icon {...p}>
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </Icon>
      );

      const Activity = (p) => (
        <Icon {...p}>
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </Icon>
      );
      const HardHat = (p) => (
        <Icon {...p}>
          <path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z" />
          <path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5" />
          <path d="M4 15v-3a6 6 0 0 1 6-6h0" />
          <path d="M14 6h0a6 6 0 0 1 6 6v3" />
        </Icon>
      );
      const XCircle = (p) => (
        <Icon {...p}>
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </Icon>
      );
      const ArrowLeft = (p) => (
        <Icon {...p}>
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </Icon>
      );

      const ChevronDown = (p) => (
        <Icon {...p}>
          <path d="m6 9 6 6 6-6" />
        </Icon>
      );

      const Pencil = (p) => (
        <Icon {...p}>
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
          <path d="m15 5 4 4" />
        </Icon>
      );

      // ==========================================
      // 3. APLICATIVO REACT PRINCIPAL
      // ==========================================

      function App() {
        const [session, setSession] = useState(null);
        const [isAuthChecking, setIsAuthChecking] = useState(true);
        const [movimentacoes, setMovimentacoes] = useState([]);
        const [absenteismo, setAbsenteismo] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [mesFiltro, setMesFiltro] = useState("");
        const [mesesDisponiveis, setMesesDisponiveis] = useState([]);

        // Navegação mobile
        const [menuOpen, setMenuOpen] = useState(false);

        useEffect(() => {
          checkSession();
        }, []);

        const checkSession = async () => {
          try {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error) throw error;
            
            if (!session) {
              window.location.href = "login.html";
              return;
            }
            
            setSession(session);

            const { data: profile } = await supabase
              .from("profiles")
              .select("status")
              .eq("id", session.user.id)
              .single();

            if (!profile || profile.status !== "aprovado") {
              window.location.href = "login.html";
              return;
            }

            setIsAuthChecking(false);
            loadData();
          } catch (error) {
            console.error("Error checking auth:", error);
            window.location.href = "login.html";
          }
        };

        const loadData = async () => {
          setIsLoading(true);
          try {
            const { data: movData } = await supabase.from("rh_movimentacoes").select("*").order("mes_ref", { ascending: false });
            const { data: absData } = await supabase.from("rh_absenteismo").select("*").order("mes_ref", { ascending: false });
            
            setMovimentacoes(movData || []);
            setAbsenteismo(absData || []);

            // Obter todos os meses únicos (agora APENAS da tabela de absenteísmo, conforme solicitado)
            const meses = new Set();
            (absData || []).forEach(a => {
                if (a.mes_ref && typeof a.mes_ref === 'string' && a.mes_ref.trim() !== '') {
                    meses.add(a.mes_ref);
                }
            });
            
            // Função para ordenar meses no formato MM/YYYY
            const ordenarMesesAno = (a, b) => {
              const [mesA, anoA] = a.split('/');
              const [mesB, anoB] = b.split('/');
              if (anoA !== anoB) return parseInt(anoB) - parseInt(anoA);
              return parseInt(mesB) - parseInt(mesA);
            };

            const mesesArray = Array.from(meses).sort(ordenarMesesAno);
            setMesesDisponiveis(mesesArray);
            
            // Set default filter to "todos" as requested
            setMesFiltro("todos");

          } catch (error) {
            console.error("Erro ao carregar indicadores:", error);
          } finally {
            setIsLoading(false);
          }
        };

        const handleLogout = async () => {
          await supabase.auth.signOut();
          window.location.href = "login.html";
        };

        // Cálculos dos indicadores para o mês selecionado
        // Função auxiliar para calcular horas úteis entre duas datas (8h seg-sex, 4h sáb)
        const calcularHorasUteis = (inicio, fim) => {
            if (inicio > fim) return 0;
            let horas = 0;
            let atual = new Date(inicio);
            while (atual <= fim) {
                const dia = atual.getDay();
                if (dia >= 1 && dia <= 5) horas += 8;
                else if (dia === 6) horas += 4;
                atual.setDate(atual.getDate() + 1);
            }
            return horas;
        };

        const kpis = useMemo(() => {
          const movMes = mesFiltro === "todos" ? movimentacoes : movimentacoes.filter(m => m.mes_ref === mesFiltro);
          const absMes = mesFiltro === "todos" ? absenteismo : absenteismo.filter(a => a.mes_ref === mesFiltro);

          // Entradas e Saídas
          const entradas = movMes.filter(m => m.tipo_movimentacao?.trim().toLowerCase() === 'entrada').length;
          const saidasTotal = movMes.filter(m => m.tipo_movimentacao?.trim().toLowerCase() === 'saida').length;
          const saidasVol = movMes.filter(m => m.tipo_movimentacao?.trim().toLowerCase() === 'saida' && m.motivo_saida?.trim().toLowerCase() === 'voluntario').length;
          const saidasInvol = movMes.filter(m => m.tipo_movimentacao?.trim().toLowerCase() === 'saida' && m.motivo_saida?.trim().toLowerCase() === 'involuntario').length;

          let taxaAbsenteismo = 0;
          let totalHorasPrevistasGlobais = 0;
          let totalHorasPerdidasGlobais = 0;
          let totalAtivosMesSelecionado = 0;

          if (mesFiltro !== "todos") {
              const [mesStr, anoStr] = mesFiltro.split("/");
              const mes = parseInt(mesStr, 10);
              const ano = parseInt(anoStr, 10);

              const dataInicioMes = new Date(ano, mes - 1, 1);
              const dataFimMes = new Date(ano, mes, 0); // Último dia do mês

              let totalHorasPrevistasMes = 0;
              let ativosNoMes = 0;

              // Para cada movimentacao, verificar se estava ativo neste mês e calcular as horas
              // OBS: Assume que 'movimentacoes' contém TODOS os registros únicos de funcionários (admissões)
              movimentacoes.forEach(m => {
                  if (m.data_admissao) {
                      const adm = new Date(m.data_admissao + "T00:00:00");
                      if (adm <= dataFimMes) { // Foi admitido antes do fim deste mês
                          let desligamento = null;
                          if (m.data_desligamento) {
                              desligamento = new Date(m.data_desligamento + "T00:00:00");
                          }

                          if (!desligamento || desligamento >= dataInicioMes) {
                              // Estava ativo em algum momento deste mês
                              ativosNoMes++;

                              // Descobrir o período trabalhado dentro deste mês
                              const dataCalculoInicio = adm > dataInicioMes ? adm : dataInicioMes;
                              const dataCalculoFim = (desligamento && desligamento < dataFimMes) ? desligamento : dataFimMes;

                              // Se trabalhou o mês todo (entrou antes do dia 1 e não saiu antes do fim) = assume 220 horas
                              if (dataCalculoInicio.getTime() === dataInicioMes.getTime() && dataCalculoFim.getTime() === dataFimMes.getTime()) {
                                  totalHorasPrevistasMes += 220;
                              } else {
                                  // Trabalhou parcialmente, calcular exato
                                  totalHorasPrevistasMes += calcularHorasUteis(dataCalculoInicio, dataCalculoFim);
                              }
                          }
                      }
                  }
              });

              totalAtivosMesSelecionado = ativosNoMes;
              const horasPerdidasMes = absMes.reduce((acc, curr) => acc + (Number(curr.horas_perdidas) || 0), 0);

              totalHorasPrevistasGlobais = totalHorasPrevistasMes;
              totalHorasPerdidasGlobais = horasPerdidasMes;

              if (totalHorasPrevistasMes > 0) {
                  taxaAbsenteismo = (horasPerdidasMes / totalHorasPrevistasMes) * 100;
              }

          } else {
              // Quando "todos" for selecionado, precisamos calcular a Média dos Percentuais Mensais
              // e acumular os totais
              totalHorasPerdidasGlobais = absMes.reduce((acc, curr) => acc + (Number(curr.horas_perdidas) || 0), 0);

              // Para "todos", mostrar total de funcionários ATIVOS atuais
              const hoje = new Date();
              let ativosHoje = 0;
              movimentacoes.forEach(m => {
                  if (m.data_admissao) {
                      const adm = new Date(m.data_admissao + "T00:00:00");
                      if (adm <= hoje) {
                          if (!m.data_desligamento) {
                              ativosHoje++;
                          } else {
                              const des = new Date(m.data_desligamento + "T00:00:00");
                              if (des >= hoje) ativosHoje++;
                          }
                      }
                  }
              });
              totalAtivosMesSelecionado = ativosHoje;

              const taxasMensais = [];
              let somaHorasPrevistas = 0;

              // Calcular para cada mês disponível
              mesesDisponiveis.forEach(mesBase => {
                  const [mStr, yStr] = mesBase.split("/");
                  const mBase = parseInt(mStr, 10);
                  const yBase = parseInt(yStr, 10);

                  const dtIni = new Date(yBase, mBase - 1, 1);
                  const dtFim = new Date(yBase, mBase, 0);

                  let prevMes = 0;
                  movimentacoes.forEach(m => {
                      if (m.data_admissao) {
                          const adm = new Date(m.data_admissao + "T00:00:00");
                          if (adm <= dtFim) {
                              let des = m.data_desligamento ? new Date(m.data_desligamento + "T00:00:00") : null;
                              if (!des || des >= dtIni) {
                                  const cIni = adm > dtIni ? adm : dtIni;
                                  const cFim = (des && des < dtFim) ? des : dtFim;

                                  if (cIni.getTime() === dtIni.getTime() && cFim.getTime() === dtFim.getTime()) {
                                      prevMes += 220;
                                  } else {
                                      prevMes += calcularHorasUteis(cIni, cFim);
                                  }
                              }
                          }
                      }
                  });

                  somaHorasPrevistas += prevMes;

                  // Perdas desse mês
                  const perdasMes = absenteismo.filter(a => a.mes_ref === mesBase).reduce((acc, curr) => acc + (Number(curr.horas_perdidas) || 0), 0);

                  if (prevMes > 0) {
                      taxasMensais.push((perdasMes / prevMes) * 100);
                  }
              });

              totalHorasPrevistasGlobais = somaHorasPrevistas;

              if (taxasMensais.length > 0) {
                  const somaTaxas = taxasMensais.reduce((a, b) => a + b, 0);
                  taxaAbsenteismo = somaTaxas / taxasMensais.length;
              }
          }

          let percVol = 0;
          let percInvol = 0;
          if (saidasTotal > 0) {
            percVol = (saidasVol / saidasTotal) * 100;
            percInvol = (saidasInvol / saidasTotal) * 100;
          }

          return {
            entradas,
            saidasTotal,
            saidasVol,
            saidasInvol,
            percVol: percVol.toFixed(1),
            percInvol: percInvol.toFixed(1),
            horasPrevistas: Math.round(totalHorasPrevistasGlobais),
            horasPerdidas: Math.round(totalHorasPerdidasGlobais),
            taxaAbsenteismo: taxaAbsenteismo.toFixed(2),
            totalAtivos: totalAtivosMesSelecionado
          };
        }, [movimentacoes, absenteismo, mesFiltro, mesesDisponiveis]);

        if (isAuthChecking) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-gray-50">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
          );
        }

        const formatarMes = (mesStr) => {
          if (!mesStr) return "";
          if (mesStr === "todos") return "Todos os Meses";
          let ano, mes;
          if (mesStr.includes("-")) {
            [ano, mes] = mesStr.split("-");
          } else if (mesStr.includes("/")) {
            [mes, ano] = mesStr.split("/");
          } else {
            return mesStr; // fallback
          }
          const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
          return `${meses[parseInt(mes, 10) - 1]}/${ano}`;
        };

        return (
          <div className="flex flex-col min-h-screen bg-[#F8FAFC]">
            {/* Header Mobile Responsivo */}
            <header className="bg-[#002060] text-white shadow-md sticky top-0 z-50">
              <div className="px-5 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <Shield size={28} className="text-[#E30613]" />
                  <div>
                    <h1 className="text-xl font-extrabold tracking-tight leading-none">PRIME RH</h1>
                    <p className="text-blue-200 text-[10px] font-semibold uppercase tracking-widest mt-1">Indicadores</p>
                  </div>
                </div>
                
                {/* Menu Toggle Mobile */}
                <button className="md:hidden p-2 text-white" onClick={() => setMenuOpen(!menuOpen)}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>

                {/* Nav Desktop */}
                <nav className="hidden md:flex items-center gap-6">
                  <a href="index.html" className="text-sm font-medium text-slate-300 hover:text-white transition-colors">EPI/Fardamento</a>
                  <a href="ferias.html" className="text-sm font-medium text-slate-300 hover:text-white transition-colors">Férias</a>
                  <span className="text-sm font-bold text-white border-b-2 border-[#E30613] pb-1">Indicadores</span>
                  <button onClick={handleLogout} className="flex items-center gap-2 text-red-300 hover:text-white ml-4 text-sm font-medium">Sair</button>
                </nav>
              </div>

              {/* Nav Mobile (dropdown) */}
              {menuOpen && (
                <nav className="md:hidden bg-[#001848] px-5 py-3 flex flex-col gap-3">
                  <a href="index.html" className="text-sm font-medium text-slate-300">EPI/Fardamento</a>
                  <a href="ferias.html" className="text-sm font-medium text-slate-300">Controle de Férias</a>
                  <span className="text-sm font-bold text-white">Indicadores de RH</span>
                  <hr className="border-slate-700 my-1"/>
                  <button onClick={handleLogout} className="text-sm font-medium text-red-300 text-left">Sair do Sistema</button>
                </nav>
              )}
            </header>

            <main className="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
              
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <div>
                  <h2 className="text-2xl font-bold text-gray-800">Acompanhamento de Indicadores</h2>
                  <p className="text-slate-500 text-sm">Visualize o desempenho do RH mensalmente.</p>
                </div>

                <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-200 shadow-sm">
                  <span className="text-sm font-medium text-slate-600">Mês Ref:</span>
                  <select 
                    className="bg-transparent text-sm font-bold text-[#002060] outline-none"
                    value={mesFiltro}
                    onChange={(e) => setMesFiltro(e.target.value)}
                  >
                    <option value="todos">Todos os Meses</option>
                    {mesesDisponiveis.map(m => (
                      <option key={m} value={m}>{formatarMes(m)}</option>
                    ))}
                    {mesesDisponiveis.length === 0 && mesFiltro !== "todos" && <option value={mesFiltro}>{formatarMes(mesFiltro)}</option>}
                  </select>
                </div>
              </div>

              {isLoading ? (
                <div className="flex flex-col items-center justify-center py-20">
                  <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#002060]"></div>
                  <p className="mt-4 text-slate-500">Buscando dados...</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  
                  {/* Absenteísmo Card */}
                  <div className="relative bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-4">
                        <h3 className="text-lg font-bold text-gray-800">Índice de Absenteísmo</h3>
                        <div className="p-2 bg-blue-50 rounded-lg">
                          <Activity size={24} className="text-blue-600"/>
                        </div>
                      </div>
                      <div className="absolute top-4 right-4">
                        <button onClick={() => window.location.href = `detalhes_absenteismo.html?mes=${mesFiltro}`} className="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-md font-medium transition-colors flex items-center gap-1 border border-blue-200">
                            Ver detalhes
                        </button>
                      </div>
                      <p className="text-sm text-slate-500 mb-6">Mede a proporção de horas perdidas em relação às horas previstas de trabalho.</p>
                      
                      <div className="flex items-end gap-3 mb-2">
                        <span className="text-4xl font-black text-[#002060]">{kpis.taxaAbsenteismo}%</span>
                      </div>
                      
                      <div className="w-full bg-slate-100 rounded-full h-2 mb-4">
                        <div className="bg-blue-600 h-2 rounded-full" style={{ width: `${Math.min(kpis.taxaAbsenteismo, 100)}%` }}></div>
                      </div>
                    </div>

                    <div className="flex justify-between mt-4 pt-4 border-t border-slate-100">
                      <div className="text-center">
                        <p className="text-[11px] font-bold text-slate-400 uppercase">Horas Previstas</p>
                        <p className="text-lg font-bold text-gray-700">{kpis.horasPrevistas}</p>
                      </div>
                      <div className="text-center">
                        <p className="text-[11px] font-bold text-slate-400 uppercase">Horas Perdidas</p>
                        <p className="text-lg font-bold text-red-500">{kpis.horasPerdidas}</p>
                      </div>
                    </div>
                  </div>

                  {/* Turnover / Perdas Card */}
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                    <div className="flex justify-between items-start mb-4">
                      <h3 className="text-lg font-bold text-gray-800">Rotatividade e Perdas</h3>
                      <div className="p-2 bg-red-50 rounded-lg">
                        <Users size={24} className="text-red-500"/>
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <p className="text-[11px] font-bold text-slate-500 uppercase">Saídas Totais</p>
                        <p className="text-2xl font-black text-[#002060]">{kpis.saidasTotal}</p>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <p className="text-[11px] font-bold text-slate-500 uppercase">Entradas</p>
                        <p className="text-2xl font-black text-green-600">{kpis.entradas}</p>
                      </div>
                    </div>

                    <h4 className="text-sm font-bold text-gray-700 mb-3 border-b border-slate-100 pb-2">Distribuição de Saídas</h4>
                    
                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between text-sm font-semibold mb-1">
                          <span className="text-slate-600">Perda Voluntária (Pedido)</span>
                          <span className="text-gray-800">{kpis.percVol}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-orange-400 h-2 rounded-full" style={{ width: `${kpis.percVol}%` }}></div>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-1">{kpis.saidasVol} colaboradores</p>
                      </div>

                      <div>
                        <div className="flex justify-between text-sm font-semibold mb-1">
                          <span className="text-slate-600">Perda Involuntária (Demissão)</span>
                          <span className="text-gray-800">{kpis.percInvol}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-[#E30613] h-2 rounded-full" style={{ width: `${kpis.percInvol}%` }}></div>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-1">{kpis.saidasInvol} colaboradores</p>
                      </div>
                    </div>

                  </div>

                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
