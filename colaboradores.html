      // Função para calcular idade a partir da data de nascimento (YYYY-MM-DD ou DD/MM/YYYY)
      function calcularIdade(dataNasc) {
        if (!dataNasc) return null;
        let d;
        if (dataNasc.includes("-")) {
          const parts = dataNasc.split("-");
          d = new Date(parts[0], parts[1] - 1, parts[2]);
        } else if (dataNasc.includes("/")) {
          const parts = dataNasc.split("/");
          d = new Date(parts[2], parts[1] - 1, parts[0]);
        } else {
          d = new Date(dataNasc);
        }
        if (isNaN(d.getTime())) return null;

        const hoje = new Date();
        let idade = hoje.getFullYear() - d.getFullYear();
        const m = hoje.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < d.getDate())) {
          idade--;
        }
        return idade >= 0 ? idade : null;
      }

      // Função para formatar CPF (000.000.000-00)
      function formatarCPF(cpfStr) {
        if (!cpfStr) return "";
        const clean = cpfStr.replace(/\D/g, "");
        if (clean.length !== 11) return cpfStr;
        return clean.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      }

      // Helper para formatar data bonitinha
      function formatarDataDisplay(str) {
        if (!str) return "-";
        if (str.includes("-")) {
          const parts = str.split("T")[0].split("-");
          if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return str;
      }

        const [formErro, setFormErro] = useState("");

        useEffect(() => {

        async function checkAuth() {
          try {
            const { data: { session } } = await supabase.auth.getSession();

              return;

            const { data: profile } = await supabase
              .from("profiles")
              .select("status")
              .eq("id", session.user.id)
              .single();

            if (!profile || profile.status !== "aprovado") {

            setIsAuthChecking(false);

              .order("nome", { ascending: true });

            if (epiErr) throw epiErr;

              .from("rh_movimentacoes")
              .select("*");

            if (movErr) throw movErr;

          } finally {
            setIsLoading(false);
          }

        // Mapeia colaboradores mesclando com movimentações (para identificar desligamento se houver)
        const listaColaboradoresProcessada = useMemo(() => {
          const movMapByCpf = {};
          const movMapByName = {};

          movimentacoes.forEach((m) => {
            if (m.cpf) movMapByCpf[m.cpf.replace(/\D/g, "")] = m;
            if (m.funcionario_nome) movMapByName[m.funcionario_nome.trim().toUpperCase()] = m;
          });

          return colaboradores.map((c) => {
            const cpfClean = (c.cpf || "").replace(/\D/g, "");
            const nomeUpper = (c.nome || "").trim().toUpperCase();

            const mov = movMapByCpf[cpfClean] || movMapByName[nomeUpper];
            const isDesligado = mov && mov.data_desligamento ? true : false;

            return {
              ...c,
              matricula: cpfClean,
              isDesligado,
              data_desligamento: mov ? mov.data_desligamento : null,
              motivo_saida: mov ? mov.motivo_saida : null,
              idade: calcularIdade(c.nascimento),
            };
          });

        const colaboradoresFiltrados = useMemo(() => {

            if (filterStatus === "desligados" && !item.isDesligado) return false;

            const matchFuncao = (item.funcao || "").toLowerCase().includes(searchLower);

            return matchNome || matchCpf || matchFuncao || matchSetor || matchUnidade;

        const handleOpenEditar = (colab) => {

        const handleCadastrarSubmit = async (e) => {
          e.preventDefault();
          setFormErro("");

          const cpfClean = formData.cpf.replace(/\D/g, "");
          if (cpfClean.length !== 11) {

            setFormErro(`Já existe um colaborador cadastrado com este CPF (${formatarCPF(cpfClean)}).`);

          }

          setIsSaving(true);
          try {
            // Formatar data admissão/nascimento para DD/MM/YYYY se necessário
            let admDisplay = formData.admissao;
            if (formData.admissao.includes("-")) {
              const p = formData.admissao.split("-");
              admDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            let nascDisplay = formData.nascimento;
            if (formData.nascimento && formData.nascimento.includes("-")) {
              const p = formData.nascimento.split("-");
              nascDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            // 1. Inserir em funcionarios_epi
            const payloadEpi = {
              cpf: cpfClean,
              nome: formData.nome.trim().toUpperCase(),
              admissao: admDisplay,
              nascimento: nascDisplay,
              sexo: formData.sexo,
              tamanho_farda: formData.tamanho_farda,

            // 2. Inserir em rh_movimentacoes (admissão)
            const payloadMov = {

              cpf: cpfClean,
              data_admissao: formData.admissao,

            await supabase.from("rh_movimentacoes").insert([payloadMov]);

            // 3. Criar entrada em rh_ferias automaticamente
            if (formData.admissao) {
              const dtAdmissao = new Date(formData.admissao + "T00:00:00");
              if (!isNaN(dtAdmissao.getTime())) {
                const dtFimAquisitivo = new Date(dtAdmissao);
                dtFimAquisitivo.setFullYear(dtFimAquisitivo.getFullYear() + 1);
                dtFimAquisitivo.setDate(dtFimAquisitivo.getDate() - 1);

                const dtVencimento = new Date(dtFimAquisitivo);
                dtVencimento.setMonth(dtVencimento.getMonth() + 11);

                await supabase.from("rh_ferias").insert([
                  {
                    funcionario_nome: formData.nome.trim().toUpperCase(),
                    cpf: cpfClean,
                    data_inicio_aquisitivo: formData.admissao,
                    data_fim_aquisitivo: dtFimAquisitivo.toISOString().split("T")[0],
                    data_vencimento: dtVencimento.toISOString().split("T")[0],
                    dias_direito: 30,
                    dias_gozados: 0,
                    status: "pendente",
                    dias_abonados: 0,

            // Log
            await supabase.from("sistema_logs").insert([

                tipo_operacao: "INSERT",
                descricao: `Novo colaborador cadastrado: ${formData.nome.trim().toUpperCase()} (CPF: ${cpfClean})`,
                dados_novos: payloadEpi,

            setIsSaving(false);

            let admDisplay = formData.admissao;

              admDisplay = `${p[2]}/${p[1]}/${p[0]}`;

            let nascDisplay = formData.nascimento;
            if (formData.nascimento && formData.nascimento.includes("-")) {
              const p = formData.nascimento.split("-");

            const updatePayload = {
              nome: formData.nome.trim().toUpperCase(),
              admissao: admDisplay,

              calca: formData.calca,

              setor: formData.setor.trim().toUpperCase(),

              .from("funcionarios_epi")
              .update(updatePayload)
              .eq("id", selectedColaborador.id);

            if (editErr) throw editErr;

            // Log
            await supabase.from("sistema_logs").insert([
              {
                tabela_afetada: "funcionarios_epi",
                tipo_operacao: "UPDATE",
                descricao: `Dados atualizados para ${formData.nome.trim().toUpperCase()} (CPF: ${cpfClean})`,
                dados_anteriores: selectedColaborador,
                dados_novos: updatePayload,

            alert("Cadastro atualizado com sucesso!");

            setSelectedColaborador(null);
            fetchData();

            setFormErro("Erro ao salvar alterações: " + err.message);

          try {

            const cpfClean = (selectedColaborador.cpf || "").replace(/\D/g, "");

            const { data: existingMov } = await supabase
              .from("rh_movimentacoes")
              .select("id")
              .or(`cpf.eq.${cpfClean},funcionario_nome.eq.${nomeColab}`)
              .maybeSingle();

            if (existingMov) {
              await supabase
                .from("rh_movimentacoes")
                .update({
                  data_desligamento: desligamentoData.data_desligamento,
                  motivo_saida: desligamentoData.motivo_saida,

                .eq("id", existingMov.id);
            } else {
              await supabase.from("rh_movimentacoes").insert([
                {
                  funcionario_nome: nomeColab,
                  cpf: cpfClean,
                  data_admissao: selectedColaborador.admissao ? selectedColaborador.admissao.split("/").reverse().join("-") : null,
                  data_desligamento: desligamentoData.data_desligamento,
                  motivo_saida: desligamentoData.motivo_saida,

            // 2. Se possuir EPIs/Fardamentos pendentes de entrega, criar pendência em devolucoes_pendentes
            const epiItens = selectedColaborador.epi_itens || "";
            const fardItens = selectedColaborador.fardamento_itens || "";

            if (epiItens.trim() !== "" || fardItens.trim() !== "") {
              await supabase.from("devolucoes_pendentes").insert([
                {
                  funcionario_nome: nomeColab,
                  cpf: cpfClean,
                  funcao: selectedColaborador.funcao,
                  setor: selectedColaborador.setor,
                  unidade: selectedColaborador.unidade,
                  local_registro: selectedColaborador.local_registro,

                  data_desligamento: desligamentoData.data_desligamento,
