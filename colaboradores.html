      function mascararNascimento(value) {
        const raw = String(value || "");
        const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        const digits = (iso ? iso[3] + iso[2] + iso[1] : raw.replace(/\D/g, "")).slice(0, 8);
        return digits.slice(0, 2) + (digits.length > 2 ? "/" + digits.slice(2, 4) : "") + (digits.length > 4 ? "/" + digits.slice(4) : "");
      }

      function lerNascimento(value) {
        const raw = String(value || "");
        const match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) || raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;
        const iso = raw.includes("/") ? match[3] + "-" + match[2] + "-" + match[1] : raw;
        const date = new Date(iso + "T12:00:00Z");
        return Number(iso.slice(0, 4)) > 0 && !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === iso ? iso : null;
      }

      function erroNascimento(value, today = RH.today()) {
        if (!value) return "";
        const iso = lerNascimento(value);
        if (!iso) return "Informe uma data de nascimento válida no formato DD/MM/AAAA.";
        return iso > today ? "A data de nascimento não pode ser futura." : "";
      }

      function calcularIdade(dataNasc) {
        const iso = lerNascimento(dataNasc);
        if (!iso || erroNascimento(dataNasc)) return null;
        const [year, month, day] = iso.split("-").map(Number);
        const [currentYear, currentMonth, currentDay] = RH.today().split("-").map(Number);
        return currentYear - year - (currentMonth < month || (currentMonth === month && currentDay < day) ? 1 : 0);
      }

      function NascimentoDigitavel({ value, onChange }) {
        return <input
          type="text"
          inputMode="numeric"
          autoComplete="bday"
          aria-label="Data de nascimento"
          placeholder="DD/MM/AAAA"
          maxLength={10}
          pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
          title="Digite dia, mês e ano: DD/MM/AAAA"
          value={mascararNascimento(value)}
          onChange={(event) => {
            const input = event.target;
            const beforeCursor = input.value.slice(0, input.selectionStart ?? input.value.length).replace(/\D/g, "").length;
            const masked = mascararNascimento(input.value);
            input.setCustomValidity("");
            onChange(masked);
            let cursor = 0, digits = 0;
            while (cursor < masked.length && digits < beforeCursor) {
              if (/\d/.test(masked[cursor])) digits++;
              cursor++;
            }
            requestAnimationFrame(() => {
              if (document.activeElement === input) input.setSelectionRange(cursor, cursor);
            });
          }}
          onBlur={(event) => event.target.setCustomValidity(erroNascimento(event.target.value))}
          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
        />;
      }

      // Função para formatar CPF (000.000.000-00)
      function formatarCPF(cpfStr) {
        if (!cpfStr) return "";
        const clean = cpfStr.replace(/\D/g, "");
        if (clean.length !== 11) return cpfStr;
        return clean.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      }

      // Helper para formatar data bonitinha
      function formatarDataDisplay(str) {
        if (!str) return "-";
        if (str.includes("-")) {
          const parts = str.split("T")[0].split("-");
          if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return str;
      }

        if (registro.includes("JEQUIE")) return String(empresasLista.find((e) => (e.cnpj || "").replace(/\D/g, "") === "52522019000282")?.id || "");

        if (registro.includes("NUNES")) return String(empresasLista.find((e) => (e.cnpj || "").replace(/\D/g, "") === "48986353000139")?.id || "");
        if (registro.includes("PRIME DISTRIBUICAO")) return String(empresasLista.find((e) => (e.cnpj || "").replace(/\D/g, "") === "52522019000100")?.id || "");
        return "";
      }

        return unidade ? `${empresa.nome} - ${unidade}` : empresa.nome;

          return colaboradores.map((c) => {
            const cpfClean = (c.cpf || "").replace(/\D/g, "");
            const nomeUpper = (c.nome || "").trim().toUpperCase();

            const mov = movMapByCpf[cpfClean] || movMapByName[nomeUpper];
            const isDesligado = Boolean(c.data_desligamento || (mov && mov.data_desligamento));

            return {
              ...c,
              matricula: cpfClean,
              isDesligado,
              data_desligamento: c.data_desligamento || (mov ? mov.data_desligamento : null),
              motivo_saida: c.motivo_saida || (mov ? mov.motivo_saida : null),
              idade: calcularIdade(c.nascimento),
            };
          });
        }, [colaboradores, movimentacoes]);

        const colaboradoresFiltrados = useMemo(() => {
          const searchLower = searchTerm.toLowerCase();
          const normalize = (value) => (value || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();

          return listaColaboradoresProcessada.filter((item) => {
            // Filtro de Status
            if (filterStatus === "ativos" && item.isDesligado) return false;
            if (filterStatus === "desligados" && !item.isDesligado) return false;
            if (filterFuncao && normalize(item.funcao) !== normalize(filterFuncao)) return false;
            if (filterSetor && normalize(item.setor) !== normalize(filterSetor)) return false;
            if (filterEmpresa && filterEmpresa !== empresaIdLegada(item, empresas)) return false;

            // Filtro de Busca (Nome, CPF, Função, Setor, Unidade)
            const matchNome = (item.nome || "").toLowerCase().includes(searchLower);
            const matchCpf = (item.cpf || "").includes(searchLower);
            const matchFuncao = (item.funcao || "").toLowerCase().includes(searchLower);
            const matchSetor = (item.setor || "").toLowerCase().includes(searchLower);
            const matchUnidade = (item.unidade || "").toLowerCase().includes(searchLower);

            return matchNome || matchCpf || matchFuncao || matchSetor || matchUnidade;
          });
        }, [listaColaboradoresProcessada, searchTerm, filterStatus, filterFuncao, filterSetor, filterEmpresa, empresas]);

        // Handlers de formulários
        const handleOpenCadastrar = () => {
          const empresaPadrao = empresas.find((e) => (e.cnpj || "").replace(/\D/g, "") === "48986353000139");
          setEditFormData({
            nome: "",
            cpf: "",
            admissao: RH.today(),
            nascimento: "",
            sexo: "M",
            tamanho_farda: "M",
            calcado: "40",
            calca: "M",
            funcao: "",
            setor: "",
            unidade: "FILIAL 5",
            local_registro: "NUNES & VIEIRA LOGISTICA LTDA",
            empresa_id: empresaPadrao ? String(empresaPadrao.id) : "",
            whatsapp: "",
            carga_horaria: 220,
            carga_horaria_semanal: "44",
            jornada_diaria: "08:48",
            dias_trabalho_semana: "5",
            data_desligamento_programada: "",
            cumprindo_aviso_previo: false,
            aviso_previo_file: null,
            rescisao_file: null,
          });
          setFormErro("");
          setIsCadastrarModalOpen(true);
        };

        const handleOpenEditar = (colab) => {
          setSelectedColaborador(colab);

          let admFormatted = colab.admissao;
          if (colab.admissao && colab.admissao.includes("/")) {
            const parts = colab.admissao.split("/");
            if (parts.length === 3) admFormatted = `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`;
          }

          let nascFormatted = colab.nascimento;
          if (colab.nascimento && colab.nascimento.includes("/")) {
            const parts = colab.nascimento.split("/");
            if (parts.length === 3) nascFormatted = `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`;
          }

          setEditFormData({
            nome: colab.nome || "",
            cpf: colab.cpf ? colab.cpf.replace(/\D/g, "") : "",
            admissao: admFormatted || "",
            nascimento: nascFormatted || "",
            sexo: colab.sexo || "M",
            tamanho_farda: colab.tamanho_farda || "M",
            calcado: colab.calcado || "40",
            calca: colab.calca || "M",
            funcao: colab.funcao || "",
            setor: colab.setor || "",
            unidade: colab.unidade || "FILIAL 5",
            local_registro: colab.local_registro || "NUNES & VIEIRA LOGISTICA LTDA",
            empresa_id: empresaIdLegada(colab, empresas),
            whatsapp: colab.whatsapp || "",
            carga_horaria: colab.carga_horaria || 220,
            carga_horaria_semanal: colab.carga_horaria_semanal ?? "",
            jornada_diaria: colab.jornada_diaria_minutos ? `${String(Math.floor(colab.jornada_diaria_minutos / 60)).padStart(2, "0")}:${String(colab.jornada_diaria_minutos % 60).padStart(2, "0")}` : "",
            dias_trabalho_semana: colab.dias_trabalho_semana ?? "",
            data_desligamento_programada: colab.data_desligamento_programada || "",
            cumprindo_aviso_previo: Boolean(colab.cumprindo_aviso_previo),
            aviso_previo_file: null,
            rescisao_file: null,
            data_desligamento: colab.data_desligamento || "",
            motivo_saida: colab.motivo_saida || "voluntario",
          });
          setFormErro("");
          setIsEditarModalOpen(true);
        };

        const handleCadastrarSubmit = async (e) => {
          e.preventDefault();
          setFormErro("");
          const birthError = erroNascimento(formData.nascimento);
          if (birthError) {
            setFormErro(birthError);
            return;
          }

          const cpfClean = formData.cpf.replace(/\D/g, "");
          if (cpfClean.length !== 11) {
            setFormErro("O CPF deve conter exatamente 11 dígitos numéricos.");
            return;
          }

          if (!formData.nome.trim()) {
            setFormErro("O Nome completo é obrigatório.");
            return;
          }
          if (formData.cumprindo_aviso_previo && (!formData.data_desligamento_programada || !formData.aviso_previo_file)) {
            setFormErro("Para marcar aviso prévio, informe a data programada e anexe o documento em PDF, JPG ou PNG.");
            return;
          }

          // Verificar duplicidade pelo CPF/matrícula
          const existe = colaboradores.find((c) => (c.cpf || "").replace(/\D/g, "") === cpfClean);
          if (existe) {
            setFormErro(`Já existe um colaborador cadastrado com este CPF (${formatarCPF(cpfClean)}).`);
            return;
          }

          setIsSaving(true);
          try {
            // Formatar data admissão/nascimento para DD/MM/YYYY se necessário
            let admDisplay = formData.admissao;
            if (formData.admissao.includes("-")) {
              const p = formData.admissao.split("-");
              admDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            let nascDisplay = formData.nascimento;
            if (formData.nascimento && formData.nascimento.includes("-")) {
              const p = formData.nascimento.split("-");
              nascDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            const employeeId = crypto.randomUUID();
            const avisoMetadata = formData.cumprindo_aviso_previo
              ? await RHScheduledNoticeFiles.upload(supabase, formData.aviso_previo_file, employeeId, formData.nome, formData.data_desligamento_programada, "aviso")
              : {};

            // 1. Inserir em funcionarios_epi
            const payloadEpi = {
              id: employeeId,
              cpf: cpfClean,
              nome: formData.nome.trim().toUpperCase(),
              admissao: admDisplay,
              nascimento: nascDisplay,
              sexo: formData.sexo,
              tamanho_farda: formData.tamanho_farda,
              calcado: formData.calcado,
              calca: formData.calca,
              funcao: formData.funcao.trim().toUpperCase(),
              setor: formData.setor.trim().toUpperCase(),
              unidade: formData.unidade,
              local_registro: formData.local_registro,
              empresa_id: formData.empresa_id || null,
              whatsapp: formData.whatsapp.trim(),
              carga_horaria: formData.carga_horaria_semanal !== "" ? Math.round(Number(formData.carga_horaria_semanal) * 5) : (Number(formData.carga_horaria) || 220),
              carga_horaria_semanal: formData.carga_horaria_semanal === "" ? null : Number(formData.carga_horaria_semanal),
              jornada_diaria_minutos: formData.jornada_diaria ? (() => { const [h,m]=formData.jornada_diaria.split(":").map(Number); return h*60+m; })() : null,
              dias_trabalho_semana: formData.dias_trabalho_semana === "" ? null : Number(formData.dias_trabalho_semana),
              data_desligamento_programada: formData.data_desligamento_programada || null,
              cumprindo_aviso_previo: Boolean(formData.cumprindo_aviso_previo),
              ...avisoMetadata,
              validacao: "☑ OK",
            };

            await RH.result(supabase.from("funcionarios_epi").insert([payloadEpi]).select(), true);

            alert("Colaborador cadastrado com sucesso e sincronizado no sistema!");
            setIsCadastrarModalOpen(false);
            fetchData();
          } catch (err) {
            console.error("Erro ao cadastrar colaborador:", err);
            setFormErro("Erro ao cadastrar no banco de dados: " + err.message);
          } finally {
            setIsSaving(false);
          }
        };

        const handleEditarSubmit = async (e) => {
          e.preventDefault();
          setFormErro("");
          const birthError = erroNascimento(formData.nascimento);
          if (birthError) {
            setFormErro(birthError);
            return;
          }

          const cpfClean = formData.cpf.replace(/\D/g, "");
          if (cpfClean.length !== 11) {
            setFormErro("O CPF deve conter exatamente 11 dígitos numéricos.");
            return;
          }

          if (colaboradores.some(c => c.id !== selectedColaborador.id && RH.cleanCpf(c.cpf) === cpfClean)) {
            setFormErro("Este CPF já pertence a outro colaborador."); return;
          }
          if (formData.cumprindo_aviso_previo && (!(formData.data_desligamento_programada || formData.data_desligamento) || (!formData.aviso_previo_file && !selectedColaborador.aviso_previo_path))) {
            setFormErro("Para marcar aviso prévio, informe a data de desligamento e anexe o documento.");
            return;
          }
          setIsSaving(true);
          try {
            let admDisplay = formData.admissao;
            if (formData.admissao.includes("-")) {
              const p = formData.admissao.split("-");
              admDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            let nascDisplay = formData.nascimento;
            if (formData.nascimento && formData.nascimento.includes("-")) {
              const p = formData.nascimento.split("-");
              nascDisplay = `${p[2]}/${p[1]}/${p[0]}`;
            }

            const avisoMetadata = formData.aviso_previo_file
              ? await RHScheduledNoticeFiles.upload(supabase, formData.aviso_previo_file, selectedColaborador.id, formData.nome, formData.data_desligamento_programada || formData.data_desligamento, "aviso")
              : {};
            const rescisaoMetadata = formData.rescisao_file
              ? await RHScheduledNoticeFiles.upload(supabase, formData.rescisao_file, selectedColaborador.id, formData.nome, formData.data_desligamento, "rescisao")
              : {};

            const updatePayload = {
              cpf: cpfClean,
              data_desligamento: formData.data_desligamento || null,
              motivo_saida: formData.data_desligamento ? formData.motivo_saida : null,
              nome: formData.nome.trim().toUpperCase(),
              admissao: admDisplay,
              nascimento: nascDisplay,
              sexo: formData.sexo,
              tamanho_farda: formData.tamanho_farda,
              calcado: formData.calcado,
              calca: formData.calca,
              funcao: formData.funcao.trim().toUpperCase(),
              setor: formData.setor.trim().toUpperCase(),
              unidade: formData.unidade,
              local_registro: formData.local_registro,
              empresa_id: formData.empresa_id || null,
              whatsapp: formData.whatsapp.trim(),
              carga_horaria: formData.carga_horaria_semanal !== "" ? Math.round(Number(formData.carga_horaria_semanal) * 5) : (Number(formData.carga_horaria) || 220),
              carga_horaria_semanal: formData.carga_horaria_semanal === "" ? null : Number(formData.carga_horaria_semanal),
              jornada_diaria_minutos: formData.jornada_diaria ? (() => { const [h,m]=formData.jornada_diaria.split(":").map(Number); return h*60+m; })() : null,
              dias_trabalho_semana: formData.dias_trabalho_semana === "" ? null : Number(formData.dias_trabalho_semana),
              data_desligamento_programada: formData.data_desligamento ? null : (formData.data_desligamento_programada || null),
              cumprindo_aviso_previo: Boolean(formData.cumprindo_aviso_previo),
              aviso_previo_path: avisoMetadata.aviso_previo_path || selectedColaborador.aviso_previo_path || null,
              aviso_previo_nome: avisoMetadata.aviso_previo_nome || selectedColaborador.aviso_previo_nome || null,
              aviso_previo_mime: avisoMetadata.aviso_previo_mime || selectedColaborador.aviso_previo_mime || null,
              aviso_previo_size: avisoMetadata.aviso_previo_size || selectedColaborador.aviso_previo_size || null,
              rescisao_path: rescisaoMetadata.rescisao_path || selectedColaborador.rescisao_path || null,
              rescisao_nome: rescisaoMetadata.rescisao_nome || selectedColaborador.rescisao_nome || null,
              rescisao_mime: rescisaoMetadata.rescisao_mime || selectedColaborador.rescisao_mime || null,
              rescisao_size: rescisaoMetadata.rescisao_size || selectedColaborador.rescisao_size || null,
            };

            await RH.result(supabase.from("funcionarios_epi")
              .update(updatePayload).eq("id", selectedColaborador.id).select(), true);

            alert("Cadastro atualizado com sucesso!");
            setIsEditarModalOpen(false);
            setSelectedColaborador(null);
            fetchData();
          } catch (err) {
            console.error("Erro ao atualizar colaborador:", err);
            setFormErro("Erro ao salvar alterações: " + err.message);
          } finally {
            setIsSaving(false);
          }
        };

        const handleDesligarSubmit = async (e) => {
          e.preventDefault();
          if (!selectedColaborador) return;

          if (desligamentoData.cumprindo_aviso_previo && (!desligamentoData.aviso_previo_file && !selectedColaborador.aviso_previo_path)) {
            alert("Para registrar aviso prévio, anexe o documento em PDF, JPG ou PNG.");
            return;
          }

          setIsSaving(true);
          try {
            const nomeColab = selectedColaborador.nome;
            const avisoMetadata = desligamentoData.aviso_previo_file
              ? await RHScheduledNoticeFiles.upload(supabase, desligamentoData.aviso_previo_file, selectedColaborador.id, selectedColaborador.nome, desligamentoData.data_desligamento, "aviso")
              : {};
            const rescisaoMetadata = desligamentoData.rescisao_file
              ? await RHScheduledNoticeFiles.upload(supabase, desligamentoData.rescisao_file, selectedColaborador.id, selectedColaborador.nome, desligamentoData.data_desligamento, "rescisao")
              : {};
            await RH.result(supabase.from("funcionarios_epi").update({
              data_desligamento: desligamentoData.data_desligamento,
              motivo_saida: desligamentoData.motivo_saida,
              data_desligamento_programada: null,
              cumprindo_aviso_previo: Boolean(desligamentoData.cumprindo_aviso_previo),
              aviso_previo_path: avisoMetadata.aviso_previo_path || selectedColaborador.aviso_previo_path || null,
              aviso_previo_nome: avisoMetadata.aviso_previo_nome || selectedColaborador.aviso_previo_nome || null,
              aviso_previo_mime: avisoMetadata.aviso_previo_mime || selectedColaborador.aviso_previo_mime || null,
              aviso_previo_size: avisoMetadata.aviso_previo_size || selectedColaborador.aviso_previo_size || null,
              rescisao_path: rescisaoMetadata.rescisao_path || selectedColaborador.rescisao_path || null,
              rescisao_nome: rescisaoMetadata.rescisao_nome || selectedColaborador.rescisao_nome || null,
              rescisao_mime: rescisaoMetadata.rescisao_mime || selectedColaborador.rescisao_mime || null,
              rescisao_size: rescisaoMetadata.rescisao_size || selectedColaborador.rescisao_size || null,
            }).eq("id", selectedColaborador.id).select(), true);

            alert(`Desligamento de ${nomeColab} registrado. Os documentos anexados serão enviados à pasta RESCISÃO/RESCISAO no Drive.`);
            setIsDesligarModalOpen(false);
            setSelectedColaborador(null);
            fetchData();
          } catch (err) {
            console.error("Erro ao desligar colaborador:", err);
            alert("Erro ao efetuar desligamento: " + err.message);
          } finally {
            setIsSaving(false);
          }
        };

        if (isAuthChecking) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-gray-50">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
            {/* Header */}
            <rh-navigation active="colaboradores"></rh-navigation>

            {/* Main Content */}
            <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">
              {/* Barra Superior & Botão Novo Colaborador */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <div className="rh-page-heading"><div><p className="eyebrow">Gestão de pessoas</p><h1>Colaboradores</h1><p className="rh-page-description">Consulte cadastros, uniformes, jornadas e desligamentos.</p></div></div>
                </div>

                <button
                  onClick={handleOpenCadastrar}
                  className="bg-[#002060] hover:bg-[#001848] text-white font-bold text-sm px-5 py-3 rounded-xl shadow-md transition-all flex items-center gap-2"
                >
                  <UserPlus size={18} /> Cadastrar Colaborador
                </button>
              </div>

              {/* Controles de Busca e Filtro */}
              <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-4 items-stretch">
                <div className="relative w-full md:w-96">
                  <Search size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Buscar por nome, CPF/Matrícula, função..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#002060]"
                  />
                </div>

                <div className="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                  <button
                    onClick={() => setFilterStatus("ativos")}
                    className={`flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      filterStatus === "ativos" ? "bg-white text-[#002060] shadow-xs" : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    Ativos ({listaColaboradoresProcessada.filter((c) => !c.isDesligado).length})
                  </button>
                  <button
                    onClick={() => setFilterStatus("desligados")}
                    className={`flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      filterStatus === "desligados" ? "bg-white text-red-600 shadow-xs" : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    Desligados ({listaColaboradoresProcessada.filter((c) => c.isDesligado).length})
                  </button>
                  <button
                    onClick={() => setFilterStatus("todos")}
                    className={`flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      filterStatus === "todos" ? "bg-white text-[#002060] shadow-xs" : "text-slate-500 hover:text-slate-800"
                    }`}
                  >
                    Todos ({listaColaboradoresProcessada.length})
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-2 w-full">
                  <rh-search-select aria-label="Filtrar por função" filter-label="Função" value={filterFuncao} onInput={(e) => setFilterFuncao(e.target.value)} className="w-full">
                    <option value="">Todas as funções</option>
                    {opcoesFuncoes.map((value) => <option key={value} value={value}>{value}</option>)}
                  </rh-search-select>
                  <rh-search-select aria-label="Filtrar por setor" filter-label="Setor" value={filterSetor} onInput={(e) => setFilterSetor(e.target.value)} className="w-full">
                    <option value="">Todos os setores</option>
                    {opcoesSetores.map((value) => <option key={value} value={value}>{value}</option>)}
                  </rh-search-select>
                  <rh-search-select aria-label="Filtrar por empresa" filter-label="Empresa" value={filterEmpresa} onInput={(e) => setFilterEmpresa(e.target.value)} className="w-full">
                    <option value="">Todas as empresas</option>
                    {opcoesEmpresasFiltro.map((empresa) => <option key={empresa.value} value={empresa.value}>{empresa.label}</option>)}
                  </rh-search-select>
                </div>
              </div>

              {/* Tabela de Colaboradores */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                {isLoading ? (
                  <div className="p-12 text-center text-slate-500">
                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-[#002060] mx-auto mb-2"></div>
                    Carregando colaboradores...
                  </div>
                ) : colaboradoresFiltrados.length === 0 ? (
                  <div className="p-12 text-center text-slate-500">Nenhum colaborador encontrado para os filtros selecionados.</div>
                ) : (
                  <>
                    {/* Visualização Compacta em Dispositivos Móveis */}
                    <div className="rh-employee-list block md:hidden divide-y divide-slate-100">
                      {colaboradoresFiltrados.map((item) => {
                        const cpfFormatado = formatarCPF(item.matricula || item.cpf);
                        return (
                          <div
                            key={item.id}
                            onClick={() => {
                              setSelectedColaborador(item);
                              setIsDetalhesModalOpen(true);
                            }}
                            className={`p-3.5 hover:bg-slate-50 transition-colors cursor-pointer flex items-center justify-between gap-3 ${
                              item.isDesligado ? "bg-red-50/40" : ""
                            }`}
                          >
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2">
                                <h4 className="font-bold text-slate-900 text-xs truncate">{item.nome}</h4>
                                {item.isDesligado && (
                                  <span className="text-[9px] font-extrabold text-red-600 bg-red-100 px-1.5 py-0.5 rounded uppercase">
                                    Desligado
                                  </span>
                                )}
                              </div>
                              <div className="flex items-center gap-2 mt-1 text-[11px] text-slate-500">
                                <span>{item.funcao || "Sem função"}</span>
                                <span>•</span>
                                <span className="font-mono">{cpfFormatado || item.cpf}</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-1">
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setSelectedColaborador(item);
                                  setIsDetalhesModalOpen(true);
                                }}
                                className="p-2 text-[#002060] bg-blue-50 rounded-xl font-bold text-[11px] flex items-center gap-1 hover:bg-blue-100"
                              >
                                <Eye size={14} />
                                Ver

                      <div>
                        <label className="block font-bold text-red-700 uppercase mb-1">Desligamento programado</label>
                        <input type="date" min={RH.today()} value={formData.data_desligamento_programada} onChange={(e) => setEditFormData({ ...formData, data_desligamento_programada: e.target.value })} className="w-full p-2.5 bg-red-50 border border-red-200 rounded-xl focus:ring-2 focus:ring-red-600 text-sm" />
                      </div>
                      {(formData.data_desligamento_programada || formData.data_desligamento) && <label className="md:col-span-2 flex items-center gap-2 text-sm font-semibold text-slate-700"><input type="checkbox" checked={formData.cumprindo_aviso_previo} onChange={(e) => setEditFormData({ ...formData, cumprindo_aviso_previo: e.target.checked })} />Está cumprindo aviso prévio</label>}{formData.cumprindo_aviso_previo && <div className="md:col-span-2"><label className="block font-bold text-red-700 uppercase mb-1">Documento do aviso prévio *</label>{selectedColaborador?.aviso_previo_nome && <p className="mb-1 text-slate-600 text-xs">Documento atual: {selectedColaborador.aviso_previo_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setEditFormData({ ...formData, aviso_previo_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-red-50 border border-red-200 rounded-xl text-sm" />{formData.aviso_previo_file && <p className="mt-1 text-xs text-slate-600">Selecionado: {formData.aviso_previo_file.name}</p>}</div>}{formData.data_desligamento && <div className="md:col-span-2"><label className="block font-bold text-slate-700 uppercase mb-1">Documento da rescisão (opcional)</label>{selectedColaborador?.rescisao_nome && <p className="mb-1 text-slate-600 text-xs">Documento atual: {selectedColaborador.rescisao_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setEditFormData({ ...formData, rescisao_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />{formData.rescisao_file && <p className="mt-1 text-xs text-slate-600">Selecionado: {formData.rescisao_file.name}</p>}</div>}

                      <div className="md:col-span-2">
                        <label className="block font-bold text-slate-700 uppercase mb-1">Local do Registro (Empresa)</label>
                        <select
                          value={formData.empresa_id || ""}
                          onChange={(e) => {
                            const empresa = empresas.find((item) => String(item.id) === e.target.value);
                            setEditFormData({ ...formData, empresa_id: e.target.value, local_registro: empresa?.nome || formData.local_registro });
                          }}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        >
                          <option value="">{formData.local_registro || "Selecione a empresa"} — filial não identificada</option>
                          {empresas.map((e) => <option key={e.id} value={String(e.id)}>{e.nome} {e.cnpj ? `(CNPJ: ${e.cnpj})` : ""}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsCadastrarModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 text-white bg-[#002060] hover:bg-[#001848] rounded-xl font-bold flex items-center gap-2 shadow-sm"
                      >
                        {isSubmitting ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Cadastrar Colaborador
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL EDITAR COLABORADOR */}
            {isEditarModalOpen && selectedColaborador && (
              <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 overflow-y-auto">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-fadeIn my-auto">
                  <div className="bg-[#002060] p-4 text-white flex justify-between items-center shrink-0">
                    <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                      <Pencil size={20} /> Editar Cadastro - {selectedColaborador.nome}
                    </h3>
                    <button onClick={() => setIsEditarModalOpen(false)} className="text-white/80 hover:text-white">
                      <XCircle size={22} />
                    </button>
                  </div>

                  <form onSubmit={handleEditarSubmit} className="p-4 sm:p-6 space-y-4 text-xs overflow-y-auto flex-1">
                    {formErro && (
                      <div className="bg-red-50 text-red-700 p-3 rounded-xl border border-red-200 flex items-start gap-2 font-medium">
                        <AlertCircle size={16} className="shrink-0 mt-0.5" />
                        <span>{formErro}</span>
                      </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="md:col-span-2">
                        <label className="block font-bold text-slate-700 uppercase mb-1">Nome Completo *</label>
                        <input
                          type="text"
                          required
                          value={formData.nome}
                          onChange={(e) => setEditFormData({ ...formData, nome: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm uppercase"
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">CPF (Matrícula - Leitura)</label>
                        <input
                          type="text"
                          disabled
                          value={formatarCPF(formData.cpf)}
                          className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-mono text-sm"
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Data de Admissão *</label>
                        <input
                          type="date"
                          required
                          value={formData.admissao}
                          onChange={(e) => setEditFormData({ ...formData, admissao: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="font-bold text-slate-700 uppercase">Data de Nascimento</label>
                          {calcularIdade(formData.nascimento) !== null && (
                            <span className="text-[10px] font-bold text-blue-800 bg-blue-100 px-2 py-0.5 rounded-full">
                              Idade: {calcularIdade(formData.nascimento)} anos
                            </span>
                          )}
                        </div>
                        <NascimentoDigitavel
                          value={formData.nascimento}
                          onChange={(nascimento) => setEditFormData({ ...formData, nascimento })}
                        />
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Sexo</label>
                        <select
                          value={formData.sexo}
                          onChange={(e) => setEditFormData({ ...formData, sexo: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        >
                          <option value="M">Masculino (M)</option>
                          <option value="F">Feminino (F)</option>
                        </select>
                      </div>

                      <ComboboxInput
                        label="Tamanho Farda / Blusa"
                        value={formData.tamanho_farda}
                        onChange={(val) => setEditFormData({ ...formData, tamanho_farda: val })}
                        options={opcoesFardas}
                        placeholder="Ex: PP, P, M, G, GG, EXG"
                      />

                      <ComboboxInput
                        label="Tamanho Calça"
                        value={formData.calca}
                        onChange={(val) => setEditFormData({ ...formData, calca: val })}
                        options={opcoesCalcas}
                        placeholder="Ex: P, M, G, 38, 40, 42"
                      />

                      <ComboboxInput
                        label="Tamanho Calçado"
                        value={formData.calcado}
                        onChange={(val) => setEditFormData({ ...formData, calcado: val })}
                        options={opcoesCalcados}
                        placeholder="Ex: 38, 40, 42"
                        uppercase={false}
                      />

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">WhatsApp</label>
                        <input
                          type="text"
                          placeholder="Ex: 73 99999-9999"
                          value={formData.whatsapp}
                          onChange={(e) => setEditFormData({ ...formData, whatsapp: e.target.value })}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        />
                      </div>

                      <ComboboxInput
                        label="Função *"
                        required={true}
                        value={formData.funcao}
                        onChange={(val) => setEditFormData({ ...formData, funcao: val })}
                        options={opcoesFuncoes}
                        placeholder="Ex: MOTORISTA DE CAMINHAO"
                      />

                      <ComboboxInput
                        label="Setor *"
                        required={true}
                        value={formData.setor}
                        onChange={(val) => setEditFormData({ ...formData, setor: val })}
                        options={opcoesSetores}
                        placeholder="Ex: TRANSPORTE, ARMAZEM, COMERCIAL"
                      />

                      <ComboboxInput
                        label="Unidade *"
                        required={true}
                        value={formData.unidade}
                        onChange={(val) => setEditFormData({ ...formData, unidade: val })}
                        options={opcoesUnidades}
                        placeholder="Ex: FILIAL 5, FILIAL 8"
                      />

                      {(selectedColaborador?.isDesligado || formData.data_desligamento) && (
                        <>
                          <div>
                            <label className="block font-bold text-red-700 uppercase mb-1">Data de Desligamento</label>
                            <input
                              type="date"
                              value={formData.data_desligamento}
                              onChange={(e) => setEditFormData({ ...formData, data_desligamento: e.target.value })}
                              className="w-full p-2.5 bg-red-50 border border-red-200 text-red-900 font-medium rounded-xl focus:bg-white focus:ring-2 focus:ring-red-600 text-sm"
                            />
                          </div>

                          <div>
                            <label className="block font-bold text-red-700 uppercase mb-1">Motivo da Saída</label>
                            <select
                              value={formData.motivo_saida}
                              onChange={(e) => setEditFormData({ ...formData, motivo_saida: e.target.value })}
                              className="w-full p-2.5 bg-red-50 border border-red-200 text-red-900 font-medium rounded-xl focus:bg-white focus:ring-2 focus:ring-red-600 text-sm"
                            >
                              <option value="voluntario">Voluntário (Pedido de Demissão)</option>
                              <option value="involuntario">Involuntário (Demissão sem justa causa)</option>
                              <option value="involuntario_justa_causa">Involuntário (Demissão com justa causa)</option>
                            </select>
                          </div>
                        </>
                      )}

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Carga Horária Semanal</label>
                        <input type="number" min="1" max="168" step="0.01" value={formData.carga_horaria_semanal} onChange={(e) => setEditFormData({ ...formData, carga_horaria_semanal: e.target.value })} placeholder="Ex: 44" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Jornada diária</label>
                        <input type="time" value={formData.jornada_diaria} onChange={(e) => setEditFormData({ ...formData, jornada_diaria: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Dias de trabalho por semana</label>
                        <select value={formData.dias_trabalho_semana} onChange={(e) => setEditFormData({ ...formData, dias_trabalho_semana: e.target.value })} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm">
                          <option value="">Não informado</option>{[1,2,3,4,5,6,7].map(d => <option key={d} value={d}>{d} {d === 1 ? "dia" : "dias"}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold text-red-700 uppercase mb-1">Desligamento programado</label>
                        <input type="date" min={RH.today()} value={formData.data_desligamento_programada} onChange={(e) => setEditFormData({ ...formData, data_desligamento_programada: e.target.value })} className="w-full p-2.5 bg-red-50 border border-red-200 rounded-xl focus:ring-2 focus:ring-red-600 text-sm" />
                      </div>
                      {(formData.data_desligamento_programada || formData.data_desligamento) && <label className="md:col-span-2 flex items-center gap-2 text-sm font-semibold text-slate-700"><input type="checkbox" checked={formData.cumprindo_aviso_previo} onChange={(e) => setEditFormData({ ...formData, cumprindo_aviso_previo: e.target.checked })} />Está cumprindo aviso prévio</label>}{formData.cumprindo_aviso_previo && <div className="md:col-span-2"><label className="block font-bold text-red-700 uppercase mb-1">Documento do aviso prévio *</label>{selectedColaborador?.aviso_previo_nome && <p className="mb-1 text-slate-600 text-xs">Documento atual: {selectedColaborador.aviso_previo_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setEditFormData({ ...formData, aviso_previo_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-red-50 border border-red-200 rounded-xl text-sm" />{formData.aviso_previo_file && <p className="mt-1 text-xs text-slate-600">Selecionado: {formData.aviso_previo_file.name}</p>}</div>}{formData.data_desligamento && <div className="md:col-span-2"><label className="block font-bold text-slate-700 uppercase mb-1">Documento da rescisão (opcional)</label>{selectedColaborador?.rescisao_nome && <p className="mb-1 text-slate-600 text-xs">Documento atual: {selectedColaborador.rescisao_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setEditFormData({ ...formData, rescisao_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />{formData.rescisao_file && <p className="mt-1 text-xs text-slate-600">Selecionado: {formData.rescisao_file.name}</p>}</div>}

                      <div className="md:col-span-2">
                        <label className="block font-bold text-slate-700 uppercase mb-1">Local do Registro (Empresa)</label>
                        <select
                          value={formData.empresa_id || ""}
                          onChange={(e) => {
                            const empresa = empresas.find((item) => String(item.id) === e.target.value);
                            setEditFormData({ ...formData, empresa_id: e.target.value, local_registro: empresa?.nome || formData.local_registro });
                          }}
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#002060] text-sm"
                        >
                          <option value="">{formData.local_registro || "Selecione a empresa"} — filial não identificada</option>
                          {empresas.map((e) => <option key={e.id} value={String(e.id)}>{e.nome} {e.cnpj ? `(CNPJ: ${e.cnpj})` : ""}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsEditarModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 text-white bg-[#002060] hover:bg-[#001848] rounded-xl font-bold flex items-center gap-2 shadow-sm"
                      >
                        {isSubmitting ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Salvar Alterações
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL DESLIGAR COLABORADOR */}
            {isDesligarModalOpen && selectedColaborador && (
              <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden animate-fadeIn my-auto">
                  <div className="bg-red-700 p-4 text-white flex justify-between items-center shrink-0">
                    <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                      <UserMinus size={20} /> Desligar Colaborador
                    </h3>
                    <button onClick={() => setIsDesligarModalOpen(false)} className="text-white/80 hover:text-white">
                      <XCircle size={22} />
                    </button>
                  </div>

                  <form onSubmit={handleDesligarSubmit} className="p-4 sm:p-6 space-y-4 text-xs overflow-y-auto flex-1">
                    <div className="bg-red-50 p-3 rounded-xl border border-red-200">
                      <p className="font-bold text-slate-800 text-sm">{selectedColaborador.nome}</p>
                      <p className="text-slate-500 mt-0.5">
                        CPF/Matrícula: <span className="font-mono">{formatarCPF(selectedColaborador.cpf)}</span>
                      </p>
                      <p className="text-slate-500">
                        Função: {selectedColaborador.funcao} | Setor: {selectedColaborador.setor}
                      </p>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Data de Demissão / Desligamento *</label>
                      <input
                        type="date"
                        required
                        value={desligamentoData.data_desligamento}
                        onChange={(e) => setDesligamentoData({ ...desligamentoData, data_desligamento: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-600 text-sm"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Motivo da Saída *</label>
                      <select
                        value={desligamentoData.motivo_saida}
                        onChange={(e) => setDesligamentoData({ ...desligamentoData, motivo_saida: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-600 text-sm"
                      >
                        <option value="voluntario">Voluntário (Pedido de Demissão)</option>
                        <option value="involuntario">Involuntário (Demissão sem justa causa)</option>
                        <option value="involuntario_justa_causa">Involuntário (Demissão com justa causa)</option>
                      </select>
                    </div>

                    <label className="flex items-center gap-2 text-sm font-semibold text-slate-700"><input type="checkbox" checked={desligamentoData.cumprindo_aviso_previo} onChange={e => setDesligamentoData({ ...desligamentoData, cumprindo_aviso_previo: e.target.checked })} />Está cumprindo aviso prévio</label>
                    {desligamentoData.cumprindo_aviso_previo && <div><label className="block font-bold text-red-700 uppercase mb-1">Documento do aviso prévio *</label>{selectedColaborador.aviso_previo_nome && <p className="mb-1 text-slate-600">Documento atual: {selectedColaborador.aviso_previo_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setDesligamentoData({ ...desligamentoData, aviso_previo_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-red-50 border border-red-200 rounded-xl text-sm" />{desligamentoData.aviso_previo_file && <p className="mt-1 text-slate-600">Selecionado: {desligamentoData.aviso_previo_file.name}</p>}</div>}
                    <div><label className="block font-bold text-slate-700 uppercase mb-1">Documento da rescisão (opcional)</label>{selectedColaborador.rescisao_nome && <p className="mb-1 text-slate-600">Documento atual: {selectedColaborador.rescisao_nome}</p>}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange={e => setDesligamentoData({ ...desligamentoData, rescisao_file: e.target.files?.[0] || null })} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />{desligamentoData.rescisao_file && <p className="mt-1 text-slate-600">Selecionado: {desligamentoData.rescisao_file.name}</p>}</div>
                    <p className="text-[11px] text-slate-500 bg-amber-50 p-2.5 rounded-lg border border-amber-200 leading-relaxed">
                      <strong>Aviso:</strong> O desligamento registrará a data na aba de movimentações, limpará o colaborador ativo de férias e, se houver EPIs ou fardamentos entregues, gerará uma pendência em devoluções.
                    </p>

                    <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsDesligarModalOpen(false)}
                        className="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 text-white bg-red-700 hover:bg-red-800 rounded-xl font-bold flex items-center gap-2 shadow-sm"
                      >
                        {isSubmitting ? (
                          <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        ) : (
                          <CheckCircle2 size={16} />
                        )}
                        Confirmar Desligamento
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
