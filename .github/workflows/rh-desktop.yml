name: RH PRIME Windows preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/rh-desktop.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name RHPrime --collect-all keyring run.py
      - uses: actions/upload-artifact@v4
        with:
          name: RHPrime-Windows-preview
          path: desktop/dist/RHPrime/
          if-no-files-found: error
